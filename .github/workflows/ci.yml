name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Linux is the primary platform (spec §11.1): full checks, tests and a smoke run.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Normally ~30 s. When the Ubuntu archive or its DNS is unreachable, apt
      # waits on every fetch and the step used to hang for ~1.5 h before
      # failing (exit 100): short apt timeouts, three attempts, and a step
      # timeout make it fail (or recover) within minutes.
      - name: Install system dependencies
        timeout-minutes: 15
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            sudo apt-get $apt_opts update &&
            sudo apt-get $apt_opts install -y libasound2-dev libudev-dev libwayland-dev \
              libxkbcommon-dev libxkbcommon-x11-0 libdbus-1-dev \
              libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
              xvfb xauth weston mesa-vulkan-drivers && exit 0
            echo "::warning::apt-get failed (attempt $attempt of 3), retrying in 30 s"
            sleep 30
          done
          exit 1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Unit and integration tests (make test-unit)
        run: cargo test --workspace
      - name: Kiosk script with a fake app (make test-kiosk)
        run: scripts/test-kiosk.sh
      - name: Multiplayer over loopback QUIC, ocw-server + ocw-bot (make test-multiplayer-local)
        run: make test-multiplayer-local
      - name: Headless server smoke run
        run: cargo run -p ocw-server -- --bots 3 --seconds 10 --fast
      - name: Desktop smoke run on X11 (Xvfb, software Vulkan; make test-screenshot)
        run: .claude/skills/run-ocw/drive.sh shot smoke-x11.png 8 -- --cmd "net.stats"
      - name: Desktop smoke run on Wayland (headless weston, software Vulkan; make test-screenshot-wayland)
        run: .claude/skills/run-ocw/drive.sh shot-wayland smoke-wayland.png 8 -- --cmd "net.stats"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-screenshots
          path: test-output/
          if-no-files-found: ignore

  # Windows and macOS: build-only checks until their ports start (spec §11.1).
  build-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (build check)
        run: cargo clippy --workspace --all-targets

  # macOS app bundle, DMG and zip (spec §11.3), ad-hoc signed; only on
  # pushes to main to save macOS runner minutes.
  macos-app:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build and package the app
        run: scripts/build-macos-app.sh target/macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            target/macos/*.dmg
            target/macos/*.zip
          if-no-files-found: error

  # Core crates must build for WebAssembly (spec §3.5).
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check core crates for wasm32 (make test-wasm)
        run: cargo check -p ocw-core -p ocw-sim -p ocw-protocol -p ocw-world -p ocw-voice --target wasm32-unknown-unknown
