# OCW – secrets (spec 3.2.4): readable only by you (mode 0600), never share it.
#
# This file lives in OCW's config folder next to ocw.toml (all other settings):
#   Linux    ~/.config/ocw/secrets.toml
#   Windows  %APPDATA%\ocw\secrets.toml
#   macOS    ~/Library/Application Support/ocw/secrets.toml
# (OCW_CONFIG_DIR points the app at another folder.) The app makes it at its
# first start with the examples below (all commented out) and keeps your
# comments when it saves. An old strava.toml or strava-token.toml there is
# moved into it at the next start (kept as *.bak).
#
# Strava upload (spec 2.8.1, the advanced way): Strava needs an API application
# of your own – no credentials ship with OCW:
#   1. https://www.strava.com/settings/api → create an application,
#      "Authorization Callback Domain" = 127.0.0.1
#   2. put its Client ID and Client Secret into the [strava] lines below
#      and remove the leading '# ' (also of the [strava] line)
#   3. start OCW, open the console (` or F12) and run `strava.connect`:
#      a browser opens, you sign in to Strava and allow access; the token is
#      kept in this file ([strava_token]) and refreshed by the app.
#   4. rides recorded with S are uploaded as Virtual Ride.
#      Console: strava.status, strava.sync, strava.disconnect
#
# The environment variables OCW_STRAVA_CLIENT_ID / OCW_STRAVA_CLIENT_SECRET
# win over this file. While the values are commented out, Strava stays off.
# Whether every saved ride is uploaded automatically is not a secret: it is
# in ocw.toml.
#
# ANT+ sensors need the ANT+ network key (16 hex digits) from Garmin's ANT+
# developer page; OCW never ships it. Enter it in Devices → ANT+ (USB stick)
# → Enter the network key, or put it into the [ant] lines below.

# ---- Examples: every section and key the app knows, commented out ----
# The known secrets (all values below are made-up placeholders), one line each: what it is, its default, its values.
# To use one, remove the "# " before its section line and its key line
# (a section only once in the file: it may be above already). The app
# adds examples of new keys at its start and never changes your values;
# a line "# ocw: no examples" stops that.
#
# [strava]
# client_id = "12345"   # Strava upload: the Client ID of your own Strava API app (strava.com/settings/api, callback domain 127.0.0.1; then strava.connect); default none: Strava off; OCW_STRAVA_CLIENT_ID wins
# client_secret = "made-up-client-secret"   # Its Client Secret; default none: Strava off; OCW_STRAVA_CLIENT_SECRET wins
#
# [strava_token]
# access_token = "made-up-access-token"   # Strava's token, written by strava.connect and refreshed by the app (do not type it)
# refresh_token = "made-up-refresh-token"   # Strava's refresh token, written by the app
# expires_at = 1800000000   # When the access token expires, in Unix seconds; written by the app
# athlete = "Ada Rider"   # The linked athlete's name as Strava gave it; written by the app
#
# [account]
# session = '{"issuer":"https://accounts.example.org","access_token":"made-up-access-token"}'   # The sign-in session (JSON) when no system keyring keeps it; written by Settings -> Account (do not type it)
#
# [ant]
# network_key = "0A1B2C3D4E5F6071"   # The ANT+ network key: 16 hex digits from Garmin's ANT+ developer page (thisisant.com, after accepting its terms), never shipped with OCW; this value is a made-up placeholder; default none: ANT+ off; or enter it in Devices -> ANT+ (USB stick)
