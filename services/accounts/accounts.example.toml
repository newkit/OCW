# The accounts backend (sign-in with Google and Strava, spec §9.1).
#
# Copy to config/accounts.toml (git-ignored: it holds the client secrets)
# and run `ocw-server --auth-config config/accounts.toml`. Setup steps
# (registering the Google client and the Strava app, redirect URIs): the
# README, chapter "Accounts and sign-in". Never commit the real file.

# The backend's public base URL (no trailing slash): the issuer of our
# tokens and the base of every endpoint. Real sign-ins need a public HTTPS
# domain; `http://127.0.0.1:PORT` works for development on one machine.
issuer = "https://accounts.example.org"
# Where the HTTP server listens; put a TLS reverse proxy (Caddy, nginx)
# in front of it that forwards https://accounts.example.org here.
listen = "127.0.0.1:8480"
# The audience the game servers check (`ocw-server --auth-audience`).
audience = "ocw"

[tokens]
# Seconds. Short access tokens; refresh tokens rotate on every use.
access_s = 600
refresh_idle_s = 2592000     # 30 days unused: sign in again
refresh_max_s = 15552000     # 180 days after the sign-in at the latest
device_s = 600               # a device code lives 10 minutes
device_interval_s = 5

[keys]
# The Ed25519 signing keys (created on first start, mode 0600), rotated
# every rotate_days; the old key stays in the JWKS until its tokens expired.
dir = "config/accounts/keys"
rotate_days = 30

[storage]
# "postgres": the hosted backend – accounts, workshop and hearts in
# PostgreSQL (spec 14 Phase 4, 4O; the migrations run at start). Its URL
# holds the password: give it in the environment variable `url_env` names
# (default DATABASE_URL), not here.
#   kind = "postgres"
#   url_env = "DATABASE_URL"
#   max_connections = 8
# "file": one JSON file (mode 0600) for a single small instance;
# "memory": nothing survives a restart (with both, the workshop and hearts
# live in memory only: development).
kind = "file"
path = "config/accounts/accounts.json"
# The 32-byte key that encrypts the stored Strava tokens (created on first
# start, mode 0600). Keep it with a backup of the store, never in git.
secrets_key = "config/accounts/secrets.key"

[hearts]
# Game servers whose signing key one of these root keys certified (the key
# hierarchy of world packages, `world-builder keys init-root` /
# `new-signing`) credit the hearts of rides they host directly; every other
# ride counts through the summary the app uploads, after the plausibility
# checks (spec 14 Phase 4, 4O Q19). Empty: no server credits directly.
roots = []
# Key ids (16 hex digits) of revoked roots or servers' signing keys.
revoked = []

[rate_limit]
# Requests per minute and client address on /token, /device_authorization,
# /authorize and the device page.
per_minute = 30
# The reverse proxy's address: then X-Forwarded-For names the client.
trusted_proxy = "127.0.0.1"

# Google: Google Cloud Console → APIs & Services → Credentials → Create
# credentials → OAuth client ID → "Web application". Authorized redirect
# URI: https://accounts.example.org/callback/google (exactly; the issuer
# above + /callback/google). Scopes: openid, profile, email.
[google]
client_id = "GOOGLE-CLIENT-ID.apps.googleusercontent.com"
client_secret = "GOOGLE-CLIENT-SECRET"

# Strava: https://www.strava.com/settings/api → "Authorization Callback
# Domain": accounts.example.org (the issuer's host). The backend's
# redirect URI is https://accounts.example.org/callback/strava.
[strava]
client_id = "STRAVA-CLIENT-ID"
client_secret = "STRAVA-CLIENT-SECRET"
# Ask for activity:write at sign-in (the athlete may untick it), so the
# Strava upload (spec §2.8) needs no second authorization.
ask_upload = true
# Strava's default application limits; the backend stays below them.
limit_15min = 200
limit_day = 2000

# The apps (public clients with PKCE). Without [[clients]] the built-in
# three are used: ocw-desktop (loopback redirect http://127.0.0.1:PORT/
# callback), ocw-kiosk (device flow) and ocw-web (needs its page below).
[[clients]]
id = "ocw-desktop"
name = "Open Cycling World"
loopback_path = "/callback"

[[clients]]
id = "ocw-kiosk"
name = "Open Cycling World kiosk"
device = true

[[clients]]
id = "ocw-web"
name = "Open Cycling World in the browser"
# The browser app's page, exactly (the redirect comes back here).
redirect_uris = ["https://ride.example.org/"]
# The page's origin may call /token and /userinfo (CORS).
origins = ["https://ride.example.org"]
