[package]
name = "ocw-server"
description = "Open Cycling World game server (modular monolith) and in-process local server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ocw-server"
path = "src/main.rs"

[dependencies]
ocw-core.workspace = true
ocw-sim.workspace = true
ocw-protocol.workspace = true
ocw-world.workspace = true
# The session world clock (spec §14 Phase 9).
ocw-sky.workspace = true
ocw-weather.workspace = true
tracing.workspace = true
sha2.workspace = true
# Voice access tokens (JWT claims, spec §7) and session statistics
# (`--stats-file`, `stats::ServerReport`).
serde_json.workspace = true
thiserror.workspace = true
serde.workspace = true
# The access token check in the hello (spec §9.1; pure, also in the
# browser's local server).
ocw-auth.workspace = true

# The lib also builds for wasm32-unknown-unknown: the browser app runs the
# GameServer in its frame loop (spec §14 Phase 10, B1; `local::FrameServer`).
# The QUIC transport (`net`), world packages from disk (`worlds`), the
# threaded local server and the binary's tools are native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# World packages for the binary's --world (load + verify).
ocw-worldstore.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true
# QUIC transport (`net`, spec §6.2). Never in the wasm crates (spec §3.5).
quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
bytes.workspace = true
# WebTransport for the browser app (spec §14 Phase 10 B3, `net::webtransport`).
web-transport-quinn.workspace = true
url.workspace = true
time.workspace = true
tokio ={ workspace = true, features = ["rt-multi-thread", "net", "io-util", "signal"] }
# Real weather from the providers (spec §14 Phase 9, S7; `realweather::http`):
# HTTPS with rustls on the server, never in the clients or the wasm build.
ureq.workspace = true
# The accounts backend (spec §9.1), run by the binary (`--auth-config`,
# `--auth-dev`); only with the `backend` feature (the apps leave it out).
ocw-accounts = { workspace = true, optional = true }
# The bundled voice server (spec §7.1.1, `voice::launcher`): fresh API keys
# from the OS random source, its log and pid file under the data dir.
getrandom.workspace = true
dirs.workspace = true

# The voice server's job object: it ends with the host, also on a crash
# (spec §7.1.1 *Lifecycle*; MIT OR Apache-2.0).
[target.'cfg(windows)'.dependencies]
win32job.workspace = true

# The system clock in the browser (std's panics on wasm32-unknown-unknown).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true

[dev-dependencies]
# Test access tokens (spec §9.1).
ed25519-dalek.workspace = true
# Temporary world packages in tests (MIT OR Apache-2.0).
tempfile = "3"

[features]
default = ["backend"]
# The accounts backend in the `ocw-server` binary (sign-in, spec §9.1).
backend = ["dep:ocw-accounts"]

[lints]
workspace = true
