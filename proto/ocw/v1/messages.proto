// Open Cycling World game protocol, version 1 (spec §6.2).
//
// Compatibility rules: only add fields; never change or reuse field numbers.
syntax = "proto3";

package ocw.v1;

// ---------------------------------------------------------------- client → server

message ClientMessage {
  oneof msg {
    Hello hello = 1;
    SensorSample sample = 2;
    DevCommand dev = 3;
    SteerIntent steer = 4;
    TurnIntent turn = 5;
    UTurn u_turn = 6;
    RouteRejoin route_rejoin = 7;
    EventRequest event = 8;
    VoiceTokenRequest voice = 9;
  }
}

// Voice chat (spec §7, §2.4): asks the game server for a short-lived
// LiveKit access token. The server decides the room from the rider's
// session (and event or group); voice itself never goes over this
// connection. Answered with a VoiceGrant. Reliable.
message VoiceTokenRequest {
  VoiceChannel channel = 1;
  // VOICE_CHANNEL_GROUP: the group's name (1–32 characters of a–z, 0–9
  // and '-'; others are refused). Anyone in the session who knows the name
  // can join until accounts and invitations exist (Phase 5).
  string group = 2;
}

enum VoiceChannel {
  // Everyone in the session (spatial: the client attenuates by distance).
  VOICE_CHANNEL_UNSPECIFIED = 0;
  VOICE_CHANNEL_SESSION = 1;
  // The entrants of the current event (group ride, race).
  VOICE_CHANNEL_EVENT = 2;
  // A named group of the session (private room).
  VOICE_CHANNEL_GROUP = 3;
}

// Events (spec §2.3): group ride, race, time trial. The server decides
// the start, the finish and the ranking (spec §6.1). Today only a local
// server accepts these from a rider (single player, started on demand);
// on a remote server organizers schedule events. Answered with a
// DevCommandResult (ok + message). Reliable.
message EventRequest {
  oneof req {
    EventStart start = 1;
    // Cancel the current event (riders ride on where they are).
    bool cancel = 2;
  }
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_GROUP_RIDE = 1;
  EVENT_KIND_RACE = 2;
  EVENT_KIND_TIME_TRIAL = 3;
}

message EventStart {
  EventKind kind = 1;
  // Finish of a race / time trial: laps of a loop or a distance; neither
  // = the default (one lap of a loop, 5 km of a route that ends).
  optional uint32 laps = 2;
  optional uint32 length_m = 3;
  // Bots in a race or group ride (absent = keep the current ones); a time
  // trial has none.
  optional uint32 bots = 4;
  // Group ride pace (W; absent = 150 W).
  optional uint32 target_w = 5;
}

// Route ride (spec §2.7, §2.2.1): back to the route after leaving it. Like
// UTurn: where the client asked (predicted distance and speed), so server
// and client add the same way back. Reliable.
message RouteRejoin {
  uint32 distance_cm = 1;
  uint32 speed_mm_s = 2;
}

// Junction steering in free ride (spec §2.2.1, §6.5): the exit the rider
// chose for the next junction, sent reliably whenever the choice changes.
// The server applies it at the lock point (~20 m before the junction);
// if it arrives too late, the default exit applies.
message TurnIntent {
  // Increasing per client; older intents are ignored.
  uint32 seq = 1;
  // The junction: vertex index in the world package's road graph.
  uint32 junction_id = 2;
  // Stable ID of the exit edge and whether it is ridden from its first
  // vertex to its last; absent = no choice (the default exit).
  optional fixed64 exit_edge_id = 3;
  bool exit_forward = 4;
}

// Manual U-turn in free ride (spec §2.2.2), where the client turned: its
// predicted distance and speed, so server and client build the same loop.
message UTurn {
  uint32 distance_cm = 1;
  uint32 speed_mm_s = 2;
}

// Steering intent (spec §6.1): the lateral offset the rider wants to move
// to; the server moves the rider there smoothly, within the road.
message SteerIntent {
  // Increasing per client; older intents are ignored.
  uint32 seq = 1;
  // Target offset from the centreline in cm (positive = right).
  sint32 lateral_target_cm = 2;
  // Lean steering (the arrow keys): instead of a target offset, the rider
  // leans by lean_mrad (positive = right) and rides a curve with it; the
  // lean stays until the rider straightens up.
  bool lean_steering = 3;
  sint32 lean_mrad = 4;
  // Wild mode: the rider is not bound to the road (spec §2.2).
  bool wild = 5;
}

// First message on a connection.
message Hello {
  uint32 protocol_version = 1;
  string display_name = 2;
  // Deprecated (spec §2.5, §3.2.1): the server takes the physics profile
  // from its curated set and only the rider's weight from the client
  // (rider_weight_kg; from here only rider_mass_kg, if that is absent).
  RiderProfile profile = 3;
  // The world package the client rides on (free ride and routes on the
  // road graph): junctions are vertex indices, so both sides must use the
  // same graph (spec §6.5). The server rejects a different one.
  WorldPackageId world = 4;
  // The active rider profile's body weight in kg (spec §3.2.1); the server
  // clamps it to 30–200 kg. Absent: the default rider (75 kg).
  optional float rider_weight_kg = 5;
  // The curated physics profile of the rider's bike (spec §2.5), e.g.
  // "road", "road-aero", "tt", "gravel", "mtb". The server looks it up in
  // its own table; an unknown or absent id is the default ("road").
  optional string bike_profile = 6;
  // The rider's cosmetic look (spec §2.5): passed to the other clients
  // for rendering, never used by the physics. Absent: the default look.
  RiderLook look = 7;
}

// Cosmetic look of a rider and bike (spec §2.5). Colours are sRGB
// 0xRRGGBB (higher bits are ignored).
message RiderLook {
  fixed32 frame_rgb = 1;
  fixed32 jersey_rgb = 2;
  fixed32 helmet_rgb = 3;
  // 0 plain, 1 band, 2 sash; unknown values are plain.
  uint32 kit_pattern = 4;
}

// Identifies a world package's road graph: its name and a fingerprint of
// the graph's content (FNV-1a 64 of its package encoding).
message WorldPackageId {
  string name = 1;
  fixed64 graph_hash = 2;
}

message RiderProfile {
  float rider_mass_kg = 1;
  float bike_mass_kg = 2;
  float cda_m2 = 3;
  float crr = 4;
}

// Measured values from the rider's devices (spec §6.1). Sent reliably.
message SensorSample {
  uint32 seq = 1;
  uint64 client_time_us = 2;
  optional float power_w = 3;
  optional float cadence_rpm = 4;
  optional float heart_rate_bpm = 5;
  // Brake key held: the server stops the rider (dev/test convenience; a
  // real trainer cannot brake).
  optional bool brake = 6;
}

// Commands that change the simulation. Only accepted by a local server (spec §2.9).
message DevCommand {
  oneof cmd {
    double teleport_distance_m = 1;
    // Free ride: to the road nearest this point (local metres).
    TeleportPoint teleport_point = 2;
  }
}

message TeleportPoint {
  double x_m = 1;
  double z_m = 2;
}

// ---------------------------------------------------------------- server → client

message ServerMessage {
  oneof msg {
    Welcome welcome = 1;
    Snapshot snapshot = 2;
    Reject reject = 3;
    DevCommandResult dev_result = 4;
    PathUpdate path = 5;
    EventState event = 6;
    VoiceGrant voice = 7;
  }
}

// Answer to a VoiceTokenRequest (spec §7): the LiveKit server URL and an
// access token (JWT, HS256) for one room, bound to the rider (identity
// "rider-<rider_id>", so clients map voices to riders on the road). An
// empty token means refused; error says why (no voice on this server,
// not in the event, too many requests).
message VoiceGrant {
  string url = 1;
  string token = 2;
  string room = 3;
  string identity = 4;
  // Unix time (s) after which the token cannot be used to join; ask again
  // before reconnecting.
  uint64 expires_unix_s = 5;
  VoiceChannel channel = 6;
  string error = 7;
}

enum EventPhase {
  // No event (none started, or cancelled).
  EVENT_PHASE_NONE = 0;
  EVENT_PHASE_SCHEDULED = 1;
  EVENT_PHASE_COUNTDOWN = 2;
  EVENT_PHASE_RUNNING = 3;
  EVENT_PHASE_FINISHED = 4;
}

// The current event (spec §2.3): sent reliably when it starts, changes
// phase, a rider finishes, and twice a second while a race or time trial
// runs (the standings). Times are server ticks (50 Hz, spec §5.2).
message EventState {
  uint32 event_id = 1;
  EventKind kind = 2;
  EventPhase phase = 3;
  uint64 countdown_tick = 4;
  uint64 go_tick = 5;
  // The server tick this state is from.
  uint64 server_tick = 6;
  // Course distance of the start line; the finish is length_m after it.
  double start_line_m = 7;
  double length_m = 8;
  // Laps of a loop, if the length was given that way (0 = a distance).
  uint32 laps = 9;
  // Group ride pace (W).
  uint32 target_w = 10;
  // Ranking, first to last (empty for group rides).
  repeated EventStanding standings = 11;
  optional uint64 finished_tick = 12;
}

message EventStanding {
  uint32 rider_id = 1;
  string display_name = 2;
  // 1-based.
  uint32 position = 3;
  // Distance past the start line (cm; negative behind it).
  sint32 progress_cm = 4;
  // Time from GO to the finish line (ms), once finished.
  optional uint32 finish_ms = 5;
  bool dnf = 6;
  // Time to the rider one place ahead (ms; absent for the leader, DNFs).
  optional uint32 gap_ahead_ms = 7;
}

// A rider's free-ride path (spec §5.2, §6.5): the server broadcasts the
// edges each rider takes as the path grows (and corrections). Reliable.
message PathUpdate {
  uint32 rider_id = 1;
  // A new path (joining, teleport): the old one is dropped.
  bool reset = 2;
  // Index of the first step below among all steps of the rider's path;
  // they replace the known steps from there on.
  uint64 first_index = 3;
  // Path distance (m) where that step starts.
  double start_m = 4;
  repeated PathStep steps = 5;
}

// One piece of a path: part of an edge, or a U-turn loop.
message PathStep {
  // Stable edge ID and the part ridden, in metres from the edge's first
  // vertex (from_m > to_m: against the edge's direction).
  fixed64 edge_id = 1;
  double from_m = 2;
  double to_m = 3;
  // Instead of an edge, a U-turn loop: 1 dead end, 2 region border,
  // 3 manual (spec §2.2.2).
  uint32 turnaround = 4;
}

message Welcome {
  uint32 protocol_version = 1;
  uint32 rider_id = 2;
  uint32 tick_rate_hz = 3;
  uint32 broadcast_rate_hz = 4;
  string route_id = 5;
  // Free ride on the road graph: paths come as PathUpdate messages.
  bool free_ride = 6;
  // The server's world package (free ride / route rides): clients with
  // another one must not join (spec §6.5).
  WorldPackageId world = 7;
  // Route ride on the road graph: the route's name (route_id is the same).
  string graph_route = 8;
  // The server issues voice tokens (VoiceTokenRequest, spec §7): clients
  // join the voice room automatically once the ride is shared (§2.4).
  bool voice = 9;
}

message Reject {
  string reason = 1;
}

message DevCommandResult {
  bool ok = 1;
  string message = 2;
}

// State of all riders. Sent as unreliable datagrams over QUIC (Phase 5).
message Snapshot {
  uint64 server_tick = 1;
  repeated RiderUpdate riders = 2;
  // Riders of connected clients (humans, the receiver included; bots are
  // not counted): voice joins automatically only on a shared ride (§2.4).
  uint32 human_riders = 3;
}

// Quantized rider state (spec §6.2).
message RiderUpdate {
  uint32 rider_id = 1;
  uint32 distance_cm = 2;
  uint32 speed_mm_s = 3;
  sint32 lateral_offset_cm = 4;
  uint32 animation_state = 5;
  uint32 last_input_seq = 6;
  uint32 power_w = 7;
  string display_name = 8;
  // Heading relative to the road in mrad (positive = right) and the
  // curvature the rider is riding on top of the road's, in 1e-4 / m.
  sint32 heading_mrad = 9;
  sint32 turn_curvature_e4 = 10;
  // The rider's physics profile id as the server validated it (it also
  // picks the bike model, spec §2.5) and their cosmetic look; absent for
  // riders of servers without cosmetics.
  string bike_profile = 11;
  RiderLook look = 12;
}
