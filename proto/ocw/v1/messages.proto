// Open Cycling World game protocol, version 1 (spec §6.2).
//
// Compatibility rules: only add fields; never change or reuse field numbers.
syntax = "proto3";

package ocw.v1;

// ---------------------------------------------------------------- client → server

message ClientMessage {
  oneof msg {
    Hello hello = 1;
    SensorSample sample = 2;
    DevCommand dev = 3;
    SteerIntent steer = 4;
    TurnIntent turn = 5;
    UTurn u_turn = 6;
    RouteRejoin route_rejoin = 7;
    EventRequest event = 8;
    VoiceTokenRequest voice = 9;
    ClockRequest clock = 10;
    WorldRequest world = 11;
    GodRequest god = 12;
    GodPose god_pose = 13;
    EchoRequest echo = 14;
    RulesRequest rules = 15;
    BikeChange bike_change = 16;
    WeatherRequest weather = 17;
  }
}

// The workshop's bike when the rider leaves it (spec §14 Phase 4, 4A,
// Q1): sent once, reliable. The server applies it at once in free ride
// and outside events (an entrant of an event that is not over gets it when
// the event ends: from the next start) and answers with a
// DevCommandResult, and with a RiderBuild to everyone once it applies.
// The client never sends physics or prices: the profile is looked up in
// the server's own table (unknown = default), the parts are catalogue ids
// whose weights and class steps come from the server's copy of the
// catalogue (unknown or unfitting ids count as the base part; W3, 4G).
message BikeChange {
  // The bike's id in the rider's garage (e.g. "road-aero" for a starter bike).
  string bike_id = 1;
  // Its frame's curated physics profile id (spec §2.5).
  string bike_profile = 2;
  RiderLook look = 3;
  // The catalogue ids of the parts on the bike (assets/parts.toml).
  repeated string parts = 4;
}

// The session's collision rules (spec §14 Phase 12A): the settings
// `ride.collisions` and `ride.chaotic_bots`. The server decides who may
// change them (Welcome.collision_access: the local servers' single
// player, the host of a shared session, nobody in an organizer's session)
// and answers with a DevCommandResult; the new rules reach everyone in
// the next Snapshot. Reliable.
message RulesRequest {
  optional bool collisions = 1;
  optional bool chaotic_bots = 2;
}

// Whose physics count in an event (spec §2.5 *Race modes*, §14 Phase 4,
// 4G). Free ride and single player are always open.
enum PhysicsMode {
  // Absent: by the event's kind (races and group rides PROFILE, time
  // trials OPEN); an older server: open.
  PHYSICS_MODE_UNSPECIFIED = 0;
  // The frame's profile and the parts, within the build caps.
  PHYSICS_MODE_OPEN = 1;
  // Only the frame's profile; the parts are cosmetic.
  PHYSICS_MODE_PROFILE = 2;
  // One profile for everyone; bikes and parts only shown.
  PHYSICS_MODE_EQUAL = 3;
}

// The collision model in force (spec §14 Phase 12A, 12G).
enum CollisionMode {
  // Absent: an older server without collisions (= off).
  COLLISION_MODE_UNSPECIFIED = 0;
  // Riders pass through each other.
  COLLISION_MODE_OFF = 1;
  // Soft bumps only, no crashes (group rides by default, Phase 12 Q2).
  COLLISION_MODE_SOFT = 2;
  // Bumps and crashes (races, free riding).
  COLLISION_MODE_FULL = 3;
}

// The echo test (spec §7 *Echo bot*): puts the session's Echo rider on the
// road (on = true; here = true: 20 m ahead of the asker, else where it is
// or ahead of the asker if it was not there) or takes it away (on =
// false). The Echo rider stands still, is marked RiderUpdate.echo, is in
// no event or standings and earns nothing. Allowed where Welcome.echo_bot
// says so (the local servers; `ocw-server --echo-bot`); answered with a
// DevCommandResult. Reliable.
message EchoRequest {
  bool on = 1;
  bool here = 2;
}

// God mode (spec §14 Phase 13): the rider leaves the road and flies as a
// unicorn. The server decides who may (Welcome.god_access; never in a
// running event) and where the rider re-enters the road; it answers with
// a GodResult. Reliable.
message GodRequest {
  oneof req {
    // Turn into the unicorn (the road position is frozen).
    bool enter = 1;
    GodLeave leave = 2;
  }
}

message GodLeave {
  // Back to where the flight began (Shift + G); otherwise land on the road
  // nearest the point below the unicorn (x_m, z_m, local metres): in free
  // ride the nearest road of the graph, on a route its nearest point.
  bool fly_back = 1;
  double x_m = 2;
  double z_m = 3;
}

// The unicorn's pose (local metres; the flight is client-driven), sent at
// 10 Hz while flying; the server checks it (speed, ceiling, inside the
// world set) and passes it on in RiderUpdate.god. Also in GodResult (the
// pose a flight starts with).
message GodPose {
  uint32 seq = 1;
  double x_m = 2;
  double y_m = 3;
  double z_m = 4;
  // View: yaw (rad, counter-clockwise from north seen from above) and
  // pitch (rad, positive = up).
  float yaw_rad = 5;
  float pitch_rad = 6;
  float speed_mps = 7;
  // A jump (dev command `god pose`, local server only): no speed check.
  bool teleport = 8;
}

// World menu (spec §3.2.1, World -> Change world): asks the server to ride
// another world package. The server owns the session (spec §6.1) and
// decides who may (Welcome.world_access): the host of a shared session by
// default, nobody when the organizer fixed the world. It rides only
// packages of its own catalog (never a path a client names). Answered with
// a DevCommandResult; when the switch is done every client gets a
// WorldChange and joins again with a Hello on the same connection.
// Reliable.
message WorldRequest {
  // The package: its id ("europe/liechtenstein"), "id@version", its name
  // or its file name as the server lists it.
  string world = 1;
  // A route of the package by name; empty: a free ride.
  string route = 2;
}

// Time machine (spec §14 Phase 9, 9D): changes the session's world clock.
// The server owns the clock (spec §6.1) and decides who may change it:
// anyone on a local server (the single player), only the host in a
// shared session (see WorldClock.access). Answered with a
// DevCommandResult (ok + message). Reliable.
message ClockRequest {
  oneof change {
    // Back to the real instant (speed x1, running).
    bool real = 1;
    // A chosen instant (Unix ms, UTC); speed and pause stay.
    sint64 fixed_unix_ms = 2;
    // The real instant plus this offset (ms; speed x1, running).
    sint64 offset_ms = 3;
    // Move the world instant by this much (ms), keeping the mode.
    sint64 step_ms = 4;
    // World seconds per second (1, 10, 60, 600; at most 3600).
    float speed = 5;
    bool paused = 6;
  }
}

// The weather machine's request (spec §14 Phase 9, S4 console `weather`;
// the menu comes with S5): answered with a DevCommandResult. The server
// checks who may (the clock's rule: anyone on a local server, the host of a
// shared session, nobody in an organizer's) and clamps the values.
message WeatherRequest {
  // Go to this weather (absent: keep it).
  Weather target = 1;
  // Over this many seconds (0: at once).
  float transition_s = 2;
  // A preset set at once also gets its ground (wet roads in rain).
  bool settle_ground = 3;
  // The simulation from now on (fronts, showers), with this seed (0: the
  // server picks one).
  bool simulate = 4;
  uint64 seed = 5;
  // Ground overrides (0-1).
  optional float wetness = 6;
  optional float puddles = 7;
  optional float snow_cover = 8;
  // A test strike now at this distance (m) and bearing (degrees).
  optional float strike_distance_m = 9;
  optional float strike_bearing_deg = 10;
}

// Voice chat (spec §7, §2.4): asks the game server for a short-lived
// LiveKit access token. The server decides the room from the rider's
// session (and event or group); voice itself never goes over this
// connection. Answered with a VoiceGrant. Reliable.
message VoiceTokenRequest {
  VoiceChannel channel = 1;
  // VOICE_CHANNEL_GROUP: the group's name (1–32 characters of a–z, 0–9
  // and '-'; others are refused). Anyone in the session who knows the name
  // can join until accounts and invitations exist (Phase 5).
  string group = 2;
}

enum VoiceChannel {
  // Everyone in the session (spatial: the client attenuates by distance).
  VOICE_CHANNEL_UNSPECIFIED = 0;
  VOICE_CHANNEL_SESSION = 1;
  // The entrants of the current event (group ride, race).
  VOICE_CHANNEL_EVENT = 2;
  // A named group of the session (private room).
  VOICE_CHANNEL_GROUP = 3;
}

// Events (spec §2.3): group ride, race, time trial. The server decides
// the start, the finish and the ranking (spec §6.1). Today only a local
// server accepts these from a rider (single player, started on demand);
// on a remote server organizers schedule events. Answered with a
// DevCommandResult (ok + message). Reliable.
message EventRequest {
  oneof req {
    EventStart start = 1;
    // Cancel the current event (riders ride on where they are).
    bool cancel = 2;
  }
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_GROUP_RIDE = 1;
  EVENT_KIND_RACE = 2;
  EVENT_KIND_TIME_TRIAL = 3;
}

message EventStart {
  EventKind kind = 1;
  // Finish of a race / time trial: laps of a loop or a distance; neither
  // = the default (one lap of a loop, 5 km of a route that ends).
  optional uint32 laps = 2;
  optional uint32 length_m = 3;
  // Bots in a race or group ride (absent = keep the current ones); a time
  // trial has none.
  optional uint32 bots = 4;
  // Group ride pace (W; absent = 150 W).
  optional uint32 target_w = 5;
  // The organizer's collision rule for the event (spec §14 Phase 12A;
  // absent: by its kind – group rides soft, races full).
  optional CollisionMode collisions = 6;
  // The organizer's race mode (absent: by its kind, see PhysicsMode).
  optional PhysicsMode physics = 7;
}

// Route ride (spec §2.7, §2.2.1): back to the route after leaving it. Like
// UTurn: where the client asked (predicted distance and speed), so server
// and client add the same way back. Reliable.
message RouteRejoin {
  uint32 distance_cm = 1;
  uint32 speed_mm_s = 2;
}

// Junction steering in free ride (spec §2.2.1, §6.5): the exit the rider
// chose for the next junction, sent reliably whenever the choice changes.
// The server applies it at the lock point (~20 m before the junction);
// if it arrives too late, the default exit applies.
message TurnIntent {
  // Increasing per client; older intents are ignored.
  uint32 seq = 1;
  // The junction: vertex index in the world package's road graph.
  uint32 junction_id = 2;
  // Stable ID of the exit edge and whether it is ridden from its first
  // vertex to its last; absent = no choice (the default exit).
  optional fixed64 exit_edge_id = 3;
  bool exit_forward = 4;
}

// Manual U-turn in free ride (spec §2.2.2), where the client turned: its
// predicted distance and speed, so server and client build the same loop.
message UTurn {
  uint32 distance_cm = 1;
  uint32 speed_mm_s = 2;
}

// Steering intent (spec §6.1): the lateral offset the rider wants to move
// to; the server moves the rider there smoothly, within the road.
message SteerIntent {
  // Increasing per client; older intents are ignored.
  uint32 seq = 1;
  // Target offset from the centreline in cm (positive = right).
  sint32 lateral_target_cm = 2;
  // Lean steering (the arrow keys): instead of a target offset, the rider
  // leans by lean_mrad (positive = right) and rides a curve with it; the
  // lean stays until the rider straightens up.
  bool lean_steering = 3;
  sint32 lean_mrad = 4;
  // Wild mode: the rider is not bound to the road (spec §2.2).
  bool wild = 5;
}

// First message on a connection.
message Hello {
  uint32 protocol_version = 1;
  string display_name = 2;
  // Deprecated (spec §2.5, §3.2.1): the server takes the physics profile
  // from its curated set and only the rider's weight from the client
  // (rider_weight_kg; from here only rider_mass_kg, if that is absent).
  RiderProfile profile = 3;
  // The world package the client rides on (free ride and routes on the
  // road graph): junctions are vertex indices, so both sides must use the
  // same graph (spec §6.5). The server rejects a different one.
  WorldPackageId world = 4;
  // The active rider profile's body weight in kg (spec §3.2.1); the server
  // clamps it to 30–200 kg. Absent: the default rider (75 kg).
  optional float rider_weight_kg = 5;
  // The curated physics profile of the rider's bike (spec §2.5), e.g.
  // "road", "road-aero", "tt", "gravel", "mtb". The server looks it up in
  // its own table; an unknown or absent id is the default ("road").
  optional string bike_profile = 6;
  // The rider's cosmetic look (spec §2.5): passed to the other clients
  // for rendering, never used by the physics. Absent: the default look.
  RiderLook look = 7;
  // The catalogue ids of the parts on the bike (spec §14 Phase 4, 4G; as
  // in BikeChange.parts): the build the rider starts with.
  repeated string parts = 8;
}

// Cosmetic look of a rider and bike (spec §2.5). Colours are sRGB
// 0xRRGGBB (higher bits are ignored).
message RiderLook {
  fixed32 frame_rgb = 1;
  fixed32 jersey_rgb = 2;
  fixed32 helmet_rgb = 3;
  // 0 plain, 1 band, 2 sash; unknown values are plain.
  uint32 kit_pattern = 4;
  // The character (spec §2.6, §14 Phase 4, 4C; W4): free looks, never
  // physics. Sent in Hello, BikeChange and RiderBuild (once per change),
  // not in the snapshots' looks. Absent: the default character; indices
  // past the palettes are the default's.
  // Body height in cm (drawn between 150 and 205 cm).
  optional uint32 height_cm = 5;
  // 0 slim, 1 medium, 2 strong.
  optional uint32 body_build = 6;
  // Index into the 12-step skin-tone palette.
  optional uint32 skin = 7;
  // Face preset: 0 classic, 1 beard, 2 moustache, 3 stubble.
  optional uint32 face = 8;
  // Hair style: 0 short, 1 buzz cut, 2 long, 3 ponytail, 4 bun, 5 bald.
  optional uint32 hair = 9;
  optional fixed32 hair_rgb = 10;
  // Glasses: 0 none, 1 sport wrap, 2 round.
  optional uint32 glasses = 11;
}

// Identifies a world package's road graph: its name and a fingerprint of
// the graph's content (FNV-1a 64 of its package encoding).
message WorldPackageId {
  string name = 1;
  fixed64 graph_hash = 2;
}

message RiderProfile {
  float rider_mass_kg = 1;
  float bike_mass_kg = 2;
  float cda_m2 = 3;
  float crr = 4;
}

// Measured values from the rider's devices (spec §6.1). Sent reliably.
message SensorSample {
  uint32 seq = 1;
  uint64 client_time_us = 2;
  optional float power_w = 3;
  optional float cadence_rpm = 4;
  optional float heart_rate_bpm = 5;
  // Brake key held: the server stops the rider (dev/test convenience; a
  // real trainer cannot brake).
  optional bool brake = 6;
  // The power is virtual (keyboard power, sim.power, the virtual
  // trainer): it earns no hearts (spec §14 Phase 4, 4E).
  optional bool virtual_power = 7;
}

// Commands that change the simulation. Only accepted by a local server (spec §2.9).
message DevCommand {
  oneof cmd {
    double teleport_distance_m = 1;
    // Free ride: to the road nearest this point (local metres).
    TeleportPoint teleport_point = 2;
    // Stage a contact for the asker (spec §14 Phase 12H, `dev.bump` /
    // `dev.crash`): the nearest other rider bumps into them from the side
    // or cuts in front (a wheel touch: the asker falls).
    StageContact stage = 3;
    // A bot's bike, power and lane (`dev.bot_bike`, spec §14 Phase 4, W3):
    // compare a stock and an upgraded bike side by side.
    BotBike bot_bike = 4;
  }
}

message BotBike {
  uint32 rider_id = 1;
  // The frame's profile (empty: keep it) and the parts, as in BikeChange.
  string bike_profile = 2;
  repeated string parts = 3;
  // Steady power (W), without the bots' gentle variation.
  optional float power_w = 4;
  // A fixed lane (m right of the road's centre), kept in the start formation.
  optional float lane_m = 5;
  // A new name tag (empty: keep it).
  string name = 6;
}

message StageContact {
  bool crash = 1;
}

message TeleportPoint {
  double x_m = 1;
  double z_m = 2;
}

// ---------------------------------------------------------------- server → client

message ServerMessage {
  oneof msg {
    Welcome welcome = 1;
    Snapshot snapshot = 2;
    Reject reject = 3;
    DevCommandResult dev_result = 4;
    PathUpdate path = 5;
    EventState event = 6;
    VoiceGrant voice = 7;
    WorldChange world_change = 8;
    GodResult god = 9;
    RiderBuild rider_build = 10;
  }
}

// A rider's bike build (spec §14 Phase 4, 4G): reliable, sent to everyone
// when it changes (BikeChange, Hello, the end of an event for a waiting
// change) and to a joining client for every rider with parts or a
// non-default character (W4). The
// snapshots carry only RiderUpdate.build_hash; a rider whose hash is not
// the last RiderBuild's is drawn on the stock bike until it arrives.
message RiderBuild {
  uint32 rider_id = 1;
  // build_hash of the build (0: the profile's stock bike).
  fixed32 build_hash = 2;
  string bike_profile = 3;
  // The fitted part ids that count, in slot order (no base parts).
  repeated string parts = 4;
  // The server's effect of the build against the profile's stock bike at
  // the reference ride (250 W, 75 kg; 4G), after the caps: speed on the
  // flat and on a 6 % climb in 1e-4 (0.01 %), the bike's mass, whether the
  // caps cut it back. Under PROFILE / EQUAL in an event the parts do not
  // count, whatever these say.
  sint32 flat_gain_e4 = 5;
  sint32 climb_gain_e4 = 6;
  uint32 bike_mass_g = 7;
  bool capped = 8;
  // The rider's full look with the character (spec §14 Phase 4, 4C, W4):
  // once per change, like the parts (the snapshots carry only the
  // colours). The kit items are catalogue ids in `parts`.
  RiderLook look = 9;
}

// Answer to a GodRequest (spec §14 Phase 13). Reliable.
message GodResult {
  bool ok = 1;
  // Why not, or what happened.
  string message = 2;
  // The rider is in god mode after the request.
  bool active = 3;
  // Entering: where the unicorn starts (above the rider).
  GodPose start = 4;
  // Leaving: the road point the rider stands on (local metres).
  double x_m = 5;
  double y_m = 6;
  double z_m = 7;
  // Leaving: whether it was the flight back to the take-off point.
  bool fly_back = 8;
}

// The session rides another world now (after the host's WorldRequest,
// spec §3.2.1). The old session has ended (the world clock goes on);
// every client loads the same package (installed locally: the same id,
// version and content hash) and joins again with a Hello on the same
// connection. Reliable.
message WorldChange {
  // The package's manifest id and version ("local/<name>", 0 without a
  // manifest).
  string package_id = 1;
  uint64 version = 2;
  // The region's name, for people.
  string name = 3;
  // The road graph (name and fingerprint), as in Welcome.world.
  WorldPackageId world = 4;
  // The route ridden (empty: a free ride).
  string route = 5;
  // SHA-256 of the package file.
  bytes content_sha256 = 6;
  // Who asked for it (display name).
  string by = 7;
}

// Answer to a VoiceTokenRequest (spec §7): the LiveKit server URL and an
// access token (JWT, HS256) for one room, bound to the rider (identity
// "rider-<rider_id>", so clients map voices to riders on the road). An
// empty token means refused; error says why (no voice on this server,
// not in the event, too many requests).
message VoiceGrant {
  string url = 1;
  string token = 2;
  string room = 3;
  string identity = 4;
  // Unix time (s) after which the token cannot be used to join; ask again
  // before reconnecting.
  uint64 expires_unix_s = 5;
  VoiceChannel channel = 6;
  string error = 7;
}

enum EventPhase {
  // No event (none started, or cancelled).
  EVENT_PHASE_NONE = 0;
  EVENT_PHASE_SCHEDULED = 1;
  EVENT_PHASE_COUNTDOWN = 2;
  EVENT_PHASE_RUNNING = 3;
  EVENT_PHASE_FINISHED = 4;
}

// The current event (spec §2.3): sent reliably when it starts, changes
// phase, a rider finishes, and twice a second while a race or time trial
// runs (the standings). Times are server ticks (50 Hz, spec §5.2).
message EventState {
  uint32 event_id = 1;
  EventKind kind = 2;
  EventPhase phase = 3;
  uint64 countdown_tick = 4;
  uint64 go_tick = 5;
  // The server tick this state is from.
  uint64 server_tick = 6;
  // Course distance of the start line; the finish is length_m after it.
  double start_line_m = 7;
  double length_m = 8;
  // Laps of a loop, if the length was given that way (0 = a distance).
  uint32 laps = 9;
  // Group ride pace (W).
  uint32 target_w = 10;
  // Ranking, first to last (empty for group rides).
  repeated EventStanding standings = 11;
  optional uint64 finished_tick = 12;
  // The collision model of the event (spec §14 Phase 12A: "collisions
  // on, damage off" in the event's info).
  CollisionMode collisions = 13;
  // The event's race mode (spec §2.5, 4G; shown in the event's info).
  PhysicsMode physics = 14;
}

message EventStanding {
  uint32 rider_id = 1;
  string display_name = 2;
  // 1-based.
  uint32 position = 3;
  // Distance past the start line (cm; negative behind it).
  sint32 progress_cm = 4;
  // Time from GO to the finish line (ms), once finished.
  optional uint32 finish_ms = 5;
  bool dnf = 6;
  // Time to the rider one place ahead (ms; absent for the leader, DNFs).
  optional uint32 gap_ahead_ms = 7;
}

// A rider's free-ride path (spec §5.2, §6.5): the server broadcasts the
// edges each rider takes as the path grows (and corrections). Reliable.
message PathUpdate {
  uint32 rider_id = 1;
  // A new path (joining, teleport): the old one is dropped.
  bool reset = 2;
  // Index of the first step below among all steps of the rider's path;
  // they replace the known steps from there on.
  uint64 first_index = 3;
  // Path distance (m) where that step starts.
  double start_m = 4;
  repeated PathStep steps = 5;
}

// One piece of a path: part of an edge, or a U-turn loop.
message PathStep {
  // Stable edge ID and the part ridden, in metres from the edge's first
  // vertex (from_m > to_m: against the edge's direction).
  fixed64 edge_id = 1;
  double from_m = 2;
  double to_m = 3;
  // Instead of an edge, a U-turn loop: 1 dead end, 2 region border,
  // 3 manual (spec §2.2.2).
  uint32 turnaround = 4;
}

message Welcome {
  uint32 protocol_version = 1;
  uint32 rider_id = 2;
  uint32 tick_rate_hz = 3;
  uint32 broadcast_rate_hz = 4;
  string route_id = 5;
  // Free ride on the road graph: paths come as PathUpdate messages.
  bool free_ride = 6;
  // The server's world package (free ride / route rides): clients with
  // another one must not join (spec §6.5).
  WorldPackageId world = 7;
  // Route ride on the road graph: the route's name (route_id is the same).
  string graph_route = 8;
  // The server issues voice tokens (VoiceTokenRequest, spec §7): clients
  // join the voice room automatically once the ride is shared (§2.4).
  bool voice = 9;
  // The session's world clock (spec §14 Phase 9); absent from older
  // servers (the client then shows the real time).
  WorldClock clock = 10;
  // Who may switch the world (WorldRequest, spec §3.2.1): the same rule as
  // the clock's access (anyone on a local server, the host by default).
  ClockAccess world_access = 11;
  // Who may enter god mode (GodRequest, spec §14 Phase 13A): anyone on a
  // local server, the host by default on a shared server, nobody in an
  // organizer's session. Absent from older servers (anyone).
  ClockAccess god_access = 12;
  // Riders may put an Echo rider on the road (EchoRequest, spec §7).
  bool echo_bot = 13;
  // The collision model in force and the session's switches (spec §14
  // Phase 12A), and who may change them (RulesRequest).
  CollisionMode collisions = 14;
  ClockAccess collision_access = 15;
  bool chaotic_bots = 16;
  // The session's weather (spec §14 Phase 9, S4); absent from older
  // servers (the client then shows clear weather).
  SessionWeather weather = 17;
}

enum ClockMode {
  CLOCK_MODE_REAL = 0;
  CLOCK_MODE_FIXED = 1;
  CLOCK_MODE_OFFSET = 2;
}

// Who may change the world clock (ClockRequest).
enum ClockAccess {
  // Every rider (a local server: the single player is the host).
  CLOCK_ACCESS_ANYONE = 0;
  // Only the host (host_rider_id): the rider who has been connected longest.
  CLOCK_ACCESS_HOST = 1;
  // Nobody (an organizer's event, set on the server).
  CLOCK_ACCESS_NOBODY = 2;
}

// The session's world clock (spec §14 Phase 9, 9A / 9D): the world instant
// at the server tick of the message it travels in, and how fast it runs.
// Clients advance it smoothly between messages.
message WorldClock {
  // World instant (Unix ms, UTC).
  sint64 world_unix_ms = 1;
  // World seconds per session second (0 = paused).
  float rate = 2;
  ClockMode mode = 3;
  // The chosen speed (also while paused).
  float speed = 4;
  bool paused = 5;
  // World minus real instant (ms).
  sint64 offset_ms = 6;
  ClockAccess access = 7;
  uint32 host_rider_id = 8;
}

message Reject {
  string reason = 1;
}

message DevCommandResult {
  bool ok = 1;
  string message = 2;
}

// State of all riders. Sent as unreliable datagrams over QUIC (Phase 5).
message Snapshot {
  uint64 server_tick = 1;
  repeated RiderUpdate riders = 2;
  // Riders of connected clients (humans, the receiver included; bots are
  // not counted): voice joins automatically only on a shared ride (§2.4).
  uint32 human_riders = 3;
  // The world clock at server_tick (spec §14 Phase 9).
  WorldClock clock = 4;
  // The collision model in force now and the chaotic-bots switch (spec
  // §14 Phase 12A: the host may change them during the ride).
  CollisionMode collisions = 5;
  bool chaotic_bots = 6;
  // The session's weather at server_tick (spec §14 Phase 9, S4).
  SessionWeather weather = 7;
}

// The weather at one moment (spec §14 Phase 9, 9E; ocw_weather::WeatherState).
message Weather {
  // Share of the sky covered (0-1).
  float cloud_cover = 1;
  CloudType cloud_type = 2;
  // Cloud base above the ground at the rider (m).
  float cloud_base_m = 3;
  Precipitation precip = 4;
  // Water equivalent (mm/h).
  float precip_mm_h = 5;
  // Visibility in fog / haze, without the precipitation's own (m).
  float fog_visibility_m = 6;
  float wind_mps = 7;
  float gust_mps = 8;
  // Where the wind comes from (degrees clockwise from north).
  float wind_from_deg = 9;
  float temperature_c = 10;
  // Relative humidity (0-1).
  float humidity = 11;
  float pressure_hpa = 12;
  float lightning_per_min = 13;
}

enum CloudType {
  CLOUD_TYPE_CUMULUS = 0;
  CLOUD_TYPE_STRATUS = 1;
  CLOUD_TYPE_CIRRUS = 2;
  CLOUD_TYPE_CUMULONIMBUS = 3;
}

enum Precipitation {
  PRECIPITATION_NONE = 0;
  PRECIPITATION_DRIZZLE = 1;
  PRECIPITATION_RAIN = 2;
  PRECIPITATION_SNOW = 3;
  PRECIPITATION_SLEET = 4;
  PRECIPITATION_HAIL = 5;
}

enum WeatherMode {
  WEATHER_MODE_FIXED = 0;
  WEATHER_MODE_SIMULATED = 1;
}

// A lightning strike (spec §14 Phase 9, S4): at a distance and bearing from
// every rider; the thunder follows at the speed of sound.
message LightningStrike {
  uint32 id = 1;
  // Session time of the flash (s).
  double at_s = 2;
  float distance_m = 3;
  float bearing_deg = 4;
  float intensity = 5;
  uint32 seed = 6;
}

// The session's weather (spec §14 Phase 9, 9A / S4): owned by the server
// like the world clock, in Welcome and every Snapshot. Clients approach it
// smoothly between snapshots and take a change made at once (immediate, a
// new revision) without easing.
message SessionWeather {
  // The weather now (during a transition: the eased state).
  Weather now = 1;
  // Seconds until a transition reaches its target (0: none).
  float transition_left_s = 2;
  // The ground (0-1): road wetness, puddles, snow cover.
  float wetness = 3;
  float puddles = 4;
  float snow_cover = 5;
  uint32 revision = 6;
  bool immediate = 7;
  WeatherMode mode = 8;
  // Who may change it (WeatherRequest): the same rule as the clock's.
  ClockAccess access = 9;
  // Seed of the gusts (the same gust everywhere at the same moment).
  uint64 seed = 10;
  // Session time of the message (s): the strikes' time base.
  double session_s = 11;
  // Strikes of the last seconds (and the coming second).
  repeated LightningStrike strikes = 12;
  // The target of a transition (absent: none).
  Weather target = 13;
}

// Quantized rider state (spec §6.2).
message RiderUpdate {
  uint32 rider_id = 1;
  uint32 distance_cm = 2;
  uint32 speed_mm_s = 3;
  sint32 lateral_offset_cm = 4;
  uint32 animation_state = 5;
  uint32 last_input_seq = 6;
  uint32 power_w = 7;
  string display_name = 8;
  // Heading relative to the road in mrad (positive = right) and the
  // curvature the rider is riding on top of the road's, in 1e-4 / m.
  sint32 heading_mrad = 9;
  sint32 turn_curvature_e4 = 10;
  // The rider's physics profile id as the server validated it (it also
  // picks the bike model, spec §2.5) and their cosmetic look; absent for
  // riders of servers without cosmetics.
  string bike_profile = 11;
  RiderLook look = 12;
  // God mode (spec §14 Phase 13E): the rider flies as a unicorn; the road
  // position above is frozen. Absent: riding.
  RiderMode mode = 13;
  // The unicorn's pose while in god mode.
  GodPose god = 14;
  // The session's Echo rider (the echo test, spec §7 *Echo bot*): a test
  // rider standing still, never in standings, earning nothing.
  bool echo = 15;
  // A crash under way (spec §14 Phase 12C); absent: riding.
  CrashState crash = 16;
  // The rider's last soft bump (the wobble and its sound, 12B).
  Bump bump = 17;
  // Hearts the server credited this rider in this session so far (spec
  // §14 Phase 4, 4E: 1 per 10 kJ of accepted work + 1 per 20 m climbed;
  // nothing for virtual power, god mode, while down, bots). A running
  // total, so a lost snapshot loses nothing.
  uint32 hearts = 18;
  // The rider's bike build (RiderBuild.build_hash; absent/0: the
  // profile's stock bike). The parts come once per change in RiderBuild.
  fixed32 build_hash = 19;
}

enum CrashPhase {
  CRASH_PHASE_NONE = 0;
  // Going down (0.8 s): the ragdoll falls.
  CRASH_PHASE_FALLING = 1;
  // Lying on the road (2-8 s by impact energy).
  CRASH_PHASE_DOWN = 2;
  // Picking up the bike, clipping in (1.5 s).
  CRASH_PHASE_REMOUNT = 3;
}

enum ContactKind {
  CONTACT_KIND_UNSPECIFIED = 0;
  CONTACT_KIND_SIDE = 1;
  CONTACT_KIND_WHEEL_TO_WHEEL = 2;
  // A front wheel into another rider's rear wheel with a lateral overlap.
  CONTACT_KIND_WHEEL_TOUCH = 3;
  CONTACT_KIND_REAR_END = 4;
  CONTACT_KIND_HEAD_ON = 5;
  // A fallen rider and bike (an obstacle).
  CONTACT_KIND_OBJECT = 6;
}

message CrashState {
  CrashPhase phase = 1;
  // Since the crash began, and the time down (ms).
  uint32 elapsed_ms = 2;
  uint32 down_ms = 3;
  ContactKind kind = 4;
  // Who the rider hit (0: none).
  uint32 by_rider = 5;
  // The push at the contact in the rider's frame (mm/s: along the
  // heading, to the right) and the speed when it happened: the client's
  // ragdoll (Phase 12 Q5).
  sint32 impulse_along_mm_s = 6;
  sint32 impulse_right_mm_s = 7;
  uint32 speed_mm_s = 8;
}

message Bump {
  // The server tick of the bump.
  uint64 tick = 1;
  // Wobble strength (mrad) and side (+1: pushed to the right, -1: left).
  uint32 strength_mrad = 2;
  sint32 side = 3;
}

enum RiderMode {
  RIDER_MODE_RIDING = 0;
  RIDER_MODE_GOD = 1;
}
