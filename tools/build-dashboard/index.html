<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCW Build Servers</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --fg: #1d2330; --muted: #677085; --line: #e3e6ec;
  --track: #e9ecf1; --ok: #1f9d55; --warn: #d98e04; --bad: #d64545; --accent: #2f6fde;
  --chip: #eef1f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --card: #1b2029; --fg: #e6e9ef; --muted: #8f98ab; --line: #2a313d;
    --track: #2a313d; --ok: #3cc47c; --warn: #e8a92b; --bad: #f06a6a; --accent: #6b9cff;
    --chip: #232a35;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
h1 { font-size: 18px; margin: 0; font-weight: 650; }
.muted { color: var(--muted); }
.overview { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 110px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; padding: 0 16px 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.card h2 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 4px; }
.card .sub { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
.os { font-size: 11px; font-weight: 500; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-bottom: 10px; }
.meter .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.meter .lbl b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
.bar i.warn { background: var(--warn); } .bar i.bad { background: var(--bad); }
.line { font-size: 13px; margin: 6px 0; }
.line .k { color: var(--muted); margin-right: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 4px 4px; }
td { padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.grp td { padding-top: 8px; font-weight: 600; border-bottom: none; }
tr.grp td .cmd { font-weight: 400; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; word-break: break-all; }
.empty { color: var(--muted); font-size: 13px; margin: 6px 0; }
.badge { font-size: 11px; font-weight: 500; border-radius: 6px; padding: 0 6px; margin-left: 4px; background: var(--chip); }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); }
.err { color: var(--bad); font-size: 13px; }
h3 { font-size: 13px; font-weight: 600; margin: 12px 0 0; }
.cmd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); word-break: break-all; }
.pip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 2px; vertical-align: -1px; background: var(--track); border: 1px solid var(--line); }
.pip.on { background: var(--accent); border-color: var(--accent); }
.warnt { color: var(--warn); }
footer { padding: 0 16px 24px; font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .meters { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>OCW build servers</h1>
  <span class="muted" id="updated">loading…</span>
</header>
<section class="overview" id="overview"></section>
<section class="chips" id="chips"></section>
<main id="cards"></main>
<footer>Read-only view of the machines in config/machines.toml, polled over SSH every 5 s. JSON: <a href="api/status">/api/status</a></footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function bytes(n) {
  if (n == null) return "?";
  const u = ["B", "KiB", "MiB", "GiB", "TiB"]; let i = 0;
  while (Math.abs(n) >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i < 2 ? n.toFixed(0) : n.toFixed(1)) + " " + u[i];
}
function dur(s) {
  if (s == null) return "?";
  s = Math.floor(s);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m ${String(x).padStart(2, "0")}s`;
  return `${x}s`;
}
// CPU of a task or process kind, % of one core (100 % = one core busy).
const cpu = (c) => c == null ? "" : `${Math.round(c)} %`;
function meter(label, pct, text) {
  const p = Math.max(0, Math.min(100, pct ?? 0));
  const cls = p >= 90 ? "bad" : p >= 70 ? "warn" : "";
  return `<div class="meter"><div class="lbl"><span>${esc(label)}</span><b>${esc(text)}</b></div>` +
         `<div class="bar"><i class="${cls}" style="width:${pct == null ? 0 : p}%"></i></div></div>`;
}

function card(m, now) {
  const head = `<h2><span class="dot ${m.online ? "ok" : m.online === false ? "bad" : ""}"></span>${esc(m.name)}<span class="os">${esc(m.os)}</span></h2>`;
  if (!m.online) {
    const seen = m.last_seen ? ` · last seen ${dur(now - m.last_seen)} ago` : "";
    return `<div class="card">${head}<div class="sub">${m.online === false ? "unreachable" : "connecting"}${seen}</div>` +
      `<div class="err">${esc(m.error || "")}${m.detail ? ` <span class="muted">– ${esc(m.detail)}</span>` : ""}</div></div>`;
  }
  const meters = [];
  meters.push(meter("CPU", m.cpu_busy, m.cpu_busy == null ? "n/a" : m.cpu_busy.toFixed(0) + " %"));
  if (m.load && m.ncpu) meters.push(meter("Load / core", 100 * m.load[0] / m.ncpu,
      `${m.load[0].toFixed(2)} / ${m.ncpu} (${m.load[1].toFixed(1)}, ${m.load[2].toFixed(1)})`));
  else if (m.runnable != null && m.ncpu) meters.push(meter("Runnable threads / core", 100 * m.runnable / m.ncpu,
      `${m.runnable} / ${m.ncpu}`));
  else meters.push(meter("Cores", null, String(m.ncpu ?? "?")));
  if (m.mem_total) meters.push(meter("Memory", 100 * m.mem_used / m.mem_total, `${bytes(m.mem_used)} / ${bytes(m.mem_total)}`));
  if (m.swap_total) meters.push(meter("Swap", 100 * m.swap_used / m.swap_total, `${bytes(m.swap_used)} / ${bytes(m.swap_total)}`));
  if (m.disk_total) meters.push(meter(`Disk ${m.disk_name || "home"}`, 100 * (m.disk_total - m.disk_free) / m.disk_total, `${bytes(m.disk_free)} free`));

  let html = `<div class="card">${head}<div class="sub">online · up ${dur(m.uptime)} · polled ${dur(now - m.polled_at)} ago (${m.poll_ms} ms)</div>`;
  html += `<div class="meters">${meters.join("")}</div>`;
  const c = m.counters;
  if (c) html += `<div class="line"><span class="k">Processor queue</span>${c.ok && m.proc_queue != null ? esc(m.proc_queue.toFixed(0)) : `<span class="muted">${esc(c.hint)}</span>`}</div>`;
  const q = m.queue;
  if (q) {
    const pips = q.slots.map((s) => `<span class="pip${s.held ? " on" : ""}" title="slot ${s.slot}: ${s.held ? esc(s.holder || "held") : "free"}"></span>`).join("");
    const held = q.slots.filter((s) => s.held).map((s) => `${s.slot}: ${esc(s.holder || "held")}`).join(", ");
    html += `<div class="line"><span class="k">Build slots</span>${pips} ${q.used} of ${q.total} used${held ? ` <span class="muted">(${held})</span>` : ""}` +
            ` · ${q.waiting ? `<b class="warnt">${q.waiting} waiting</b>` : "0 waiting"}</div>`;
  }
  const k = m.kiosk;
  if (k) {
    const st = k.running ? `<span class="dot ok"></span>app running ${dur(k.elapsed)}` : `<span class="dot bad"></span>app not running`;
    const bt = (k.bluetooth || []).length ? k.bluetooth.map(esc).join(", ") : "none";
    html += `<div class="line"><span class="k">Kiosk</span>${st} · build ${esc(k.version || "?")} · Bluetooth: ${bt}</div>`;
  }
  const tasks = (m.tasks || []).filter((t) => t.state !== "waiting");
  if (!tasks.length) html += `<div class="empty">No build tasks running.</div>`;
  else {
    html += `<table><thead><tr><th>Running task / process</th><th class="n">#</th><th class="n">Running</th><th class="n">CPU</th><th class="n">Memory</th></tr></thead><tbody>`;
    for (const g of tasks) {
      const st = `<span class="badge ok">running${g.slot ? " · slot " + esc(g.slot) : ""}</span>`;
      const src = g.source === "process" ? ` <span class="muted" title="processes only, no remote.sh task marker">(no marker)</span>` : "";
      html += `<tr class="grp"><td colspan="2">${esc(g.checkout)} ${st}${src}${g.command ? `<div class="cmd">${esc(g.command)}</div>` : ""}</td>` +
              `<td class="n">${dur(g.elapsed)}</td><td class="n">${cpu(g.cpu)}</td><td class="n">${g.rss ? bytes(g.rss) : ""}</td></tr>`;
      for (const kd of g.kinds) {
        html += `<tr><td title="${esc(kd.example)}">${esc(kd.kind)}</td><td class="n">${kd.count}</td><td class="n">${dur(kd.elapsed)}</td><td class="n">${cpu(kd.cpu)}</td><td class="n">${bytes(kd.rss)}</td></tr>`;
      }
    }
    html += `</tbody></table>`;
  }
  const queued = (q && q.queued) || [];
  if (queued.length) {
    html += `<h3>Queue <span class="badge warn">${queued.length} waiting for a build slot</span></h3>`;
    html += `<table class="queue"><thead><tr><th>#</th><th>Checkout / command</th><th class="n">Waiting</th><th class="n">Since</th></tr></thead><tbody>`;
    queued.forEach((w, i) => {
      const since = w.since ? new Date(w.since * 1000).toLocaleTimeString() : "?";
      html += `<tr><td class="n">${i + 1}</td><td><b>${esc(w.checkout)}</b>${w.command ? `<div class="cmd">${esc(w.command)}</div>` : ` <span class="muted">(no marker)</span>`}</td>` +
              `<td class="n">${dur(w.elapsed)}</td><td class="n">${esc(since)}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  if (m.stale_markers) html += `<div class="empty">${m.stale_markers} stale task marker${m.stale_markers === 1 ? "" : "s"} of ended runs ignored.</div>`;
  return html + `</div>`;
}

function render(st) {
  const now = st.generated_at, o = st.overview;
  $("overview").innerHTML = [
    [`${o.online}/${o.machines}`, "machines online"],
    [o.tasks, "running"],
    [o.waiting, "waiting for a slot"],
    [`${o.slots_used} of ${o.slots_total}`, "build slots used"],
  ].map(([v, l]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("");
  $("chips").innerHTML = st.machines.map((m) => {
    const n = (m.tasks || []).filter((t) => t.state !== "waiting").length, w = (m.queue || {}).waiting || 0;
    const cls = m.online ? (w ? "warn" : "ok") : m.online === false ? "bad" : "";
    const info = m.online ? `${n} task${n === 1 ? "" : "s"}${w ? `, ${w} waiting` : ""}` : (m.online === false ? "unreachable" : "…");
    return `<span class="chip"><span class="dot ${cls}"></span>${esc(m.name)} · ${info}</span>`;
  }).join("");
  $("cards").innerHTML = st.machines.map((m) => card(m, now)).join("");
  $("updated").textContent = "updated " + new Date(now * 1000).toLocaleTimeString();
}

async function refresh() {
  try {
    const r = await fetch("api/status", { cache: "no-store" });
    render(await r.json());
  } catch (e) {
    $("updated").textContent = "dashboard server not reachable (" + e.message + ")";
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
