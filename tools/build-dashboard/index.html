<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCW Build Servers</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --fg: #1d2330; --muted: #677085; --line: #e3e6ec;
  --track: #e9ecf1; --ok: #1f9d55; --warn: #d98e04; --bad: #d64545; --accent: #2f6fde;
  --chip: #eef1f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --card: #1b2029; --fg: #e6e9ef; --muted: #8f98ab; --line: #2a313d;
    --track: #2a313d; --ok: #3cc47c; --warn: #e8a92b; --bad: #f06a6a; --accent: #6b9cff;
    --chip: #232a35;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
h1 { font-size: 18px; margin: 0; font-weight: 650; }
.muted { color: var(--muted); }
.overview { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 110px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; padding: 0 16px 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.card h2 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 4px; }
.card .sub { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
.os { font-size: 11px; font-weight: 500; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-bottom: 10px; }
.meter .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.meter .lbl b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
.bar i.warn { background: var(--warn); } .bar i.bad { background: var(--bad); }
.line { font-size: 13px; margin: 6px 0; }
.line .k { color: var(--muted); margin-right: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 4px 4px; }
td { padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.grp td { padding-top: 8px; font-weight: 600; border-bottom: none; }
tr.grp td .cmd { font-weight: 400; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; word-break: break-all; }
.empty { color: var(--muted); font-size: 13px; margin: 6px 0; }
.badge { font-size: 11px; font-weight: 500; border-radius: 6px; padding: 0 6px; margin-left: 4px; background: var(--chip); }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); }
.err { color: var(--bad); font-size: 13px; }
h3 { font-size: 13px; font-weight: 600; margin: 12px 0 0; }
.desc { font-size: 13px; font-weight: 500; color: var(--fg); margin: 2px 0 1px; cursor: help; }
.cmd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); word-break: break-all; }
.pip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 2px; vertical-align: -1px; background: var(--track); border: 1px solid var(--line); }
.pip.on { background: var(--accent); border-color: var(--accent); }
.warnt { color: var(--warn); }
.alert { margin: 0 16px 12px; padding: 10px 14px; border-radius: 10px; background: var(--bad); color: #fff; font-weight: 600; }
.alert div + div { margin-top: 4px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 0 16px 16px; min-width: 0; }
.panel h2 { font-size: 16px; margin: 0 0 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.panel .tools { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--muted); }
.panel .tools label { cursor: pointer; }
details.qg { border-top: 1px solid var(--line); padding: 6px 0; }
details.qg summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
details.qg summary .muted { font-weight: 400; }
.q { margin: 8px 0 8px 14px; font-size: 13px; }
.q .qid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); margin-right: 6px; }
.q .qt { font-weight: 600; }
.q .qtext { color: var(--fg); margin-top: 1px; overflow-wrap: anywhere; }
.q .qprop { color: var(--muted); margin-top: 2px; }
.q.decided { opacity: .65; }
.af { margin-top: 6px; }
.af textarea, .tokenbox input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 8px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); resize: vertical; }
.tokenbox { margin: 6px 0 8px; font-size: 13px; }
.tokenbox .arow input { flex: 1; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.arow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }
.panel button { font: inherit; font-size: 13px; min-height: 40px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--chip); color: var(--fg); text-align: left; max-width: 100%; }
.panel button.send { background: var(--accent); border-color: var(--accent); color: #fff; }
.panel button.linkb { min-height: 0; padding: 0 4px; border: none; background: none; color: var(--accent); text-decoration: underline; }
.panel button:focus-visible, .af textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ans { margin-top: 6px; padding: 6px 8px; border-left: 3px solid var(--warn); background: var(--chip); border-radius: 4px; }
.anstext { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; }
.amsg { font-size: 12px; color: var(--muted); }
.badge.bad { color: var(--bad); }
footer { padding: 0 16px 24px; font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .meters { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>OCW build servers</h1>
  <span class="muted" id="updated">loading…</span>
</header>
<section id="alerts"></section>
<section class="overview" id="overview"></section>
<section class="chips" id="chips"></section>
<main id="cards"></main>
<section class="panel" id="questions"></section>
<section class="panel" id="janitor"></section>
<footer>View of the machines in config/machines.toml, polled over SSH every 5 s; the only thing it changes is the janitor's cleanup of build artefacts (target/) when a disk fills up. Open questions: from SPECIFICATION.md of the main checkout. JSON: <a href="api/status">/api/status</a></footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function bytes(n) {
  if (n == null) return "?";
  const u = ["B", "KiB", "MiB", "GiB", "TiB"]; let i = 0;
  while (Math.abs(n) >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i < 2 ? n.toFixed(0) : n.toFixed(1)) + " " + u[i];
}
function dur(s) {
  if (s == null) return "?";
  s = Math.floor(s);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m ${String(x).padStart(2, "0")}s`;
  return `${x}s`;
}
// CPU of a task or process kind, % of one core (100 % = one core busy).
const cpu = (c) => c == null ? "" : `${Math.round(c)} %`;
// What the job is trying to achieve (built by the dashboard from the command,
// the agent task or the commit being checked); the tooltip has the breakdown.
function descHtml(t) {
  if (!t.description) return "";
  return `<div class="desc" title="${esc(t.description_detail || t.description)}">${esc(t.description)}</div>`;
}
function meter(label, pct, text, warnAt = 70, badAt = 90) {
  const p = Math.max(0, Math.min(100, pct ?? 0));
  const cls = p >= badAt ? "bad" : p >= warnAt ? "warn" : "";
  return `<div class="meter"><div class="lbl"><span>${esc(label)}</span><b>${esc(text)}</b></div>` +
         `<div class="bar"><i class="${cls}" style="width:${pct == null ? 0 : p}%"></i></div></div>`;
}

let janitorState = {};
function janitorLine(r, now) {
  if (!r) return "";
  const ago = r.at ? ` ${dur(now - r.at)} ago` : "";
  let txt;
  if (r.error) txt = `<span class="warnt">last pass${ago} failed</span> <span class="muted">(${esc(r.error)})</span>`;
  else {
    const acts = r.actions || [], size = acts.reduce((a, x) => a + (x.bytes || 0), 0);
    const verb = r.mode === "dry-run" ? "would delete" : "deleted";
    txt = `last pass${ago}: disk ${esc(r.pct)} %, ` + (acts.length ? `${verb} ${acts.length} × target/ (${bytes(size)})` : "nothing to do");
    if (acts.length) txt += `<div class="cmd">${acts.map((a) => esc(`${a.path} – ${a.reason}`)).join("<br>")}</div>`;
  }
  return `<div class="line"><span class="k">Janitor</span>${txt}</div>`;
}

function card(m, now) {
  const head = `<h2><span class="dot ${m.online ? "ok" : m.online === false ? "bad" : ""}"></span>${esc(m.name)}<span class="os">${esc(m.os)}</span></h2>`;
  if (!m.online) {
    const seen = m.last_seen ? ` · last seen ${dur(now - m.last_seen)} ago` : "";
    return `<div class="card">${head}<div class="sub">${m.online === false ? "unreachable" : "connecting"}${seen}</div>` +
      `<div class="err">${esc(m.error || "")}${m.detail ? ` <span class="muted">– ${esc(m.detail)}</span>` : ""}</div></div>`;
  }
  const meters = [];
  meters.push(meter("CPU", m.cpu_busy, m.cpu_busy == null ? "n/a" : m.cpu_busy.toFixed(0) + " %"));
  if (m.load && m.ncpu) meters.push(meter("Load / core", 100 * m.load[0] / m.ncpu,
      `${m.load[0].toFixed(2)} / ${m.ncpu} (${m.load[1].toFixed(1)}, ${m.load[2].toFixed(1)})`));
  else if (m.runnable != null && m.ncpu) meters.push(meter("Runnable threads / core", 100 * m.runnable / m.ncpu,
      `${m.runnable} / ${m.ncpu}`));
  else meters.push(meter("Cores", null, String(m.ncpu ?? "?")));
  if (m.mem_total) meters.push(meter("Memory", 100 * m.mem_used / m.mem_total, `${bytes(m.mem_used)} / ${bytes(m.mem_total)}`));
  if (m.swap_total) meters.push(meter("Swap", 100 * m.swap_used / m.swap_total, `${bytes(m.swap_used)} / ${bytes(m.swap_total)}`));
  // Disk watcher: the janitor cleans up above 75 % and 85 %, alerts above 92 %.
  if ((m.disks || []).length) for (const d of m.disks) meters.push(meter(`Disk ${d.name} (${d.role})`, d.pct,
      `${d.pct == null ? "?" : d.pct.toFixed(0) + " %"} · ${bytes(d.free)} free`, 75, 85));
  else if (m.disk_total) meters.push(meter(`Disk ${m.disk_name || "home"}`, 100 * (m.disk_total - m.disk_free) / m.disk_total, `${bytes(m.disk_free)} free`));

  let html = `<div class="card">${head}<div class="sub">online · up ${dur(m.uptime)} · polled ${dur(now - m.polled_at)} ago (${m.poll_ms} ms)</div>`;
  html += `<div class="meters">${meters.join("")}</div>`;
  const c = m.counters;
  if (c) html += `<div class="line"><span class="k">Processor queue</span>${c.ok && m.proc_queue != null ? esc(m.proc_queue.toFixed(0)) : `<span class="muted">${esc(c.hint)}</span>`}</div>`;
  const q = m.queue;
  if (q) {
    const pips = q.slots.map((s) => `<span class="pip${s.held ? " on" : ""}" title="slot ${s.slot}: ${s.held ? esc(s.holder || "held") : "free"}"></span>`).join("");
    const held = q.slots.filter((s) => s.held).map((s) => `${s.slot}: ${esc(s.holder || "held")}`).join(", ");
    html += `<div class="line"><span class="k">Build slots</span>${pips} ${q.used} of ${q.total} used${held ? ` <span class="muted">(${held})</span>` : ""}` +
            ` · ${q.waiting ? `<b class="warnt">${q.waiting} waiting</b>` : "0 waiting"}</div>`;
  }
  const k = m.kiosk;
  if (k) {
    const st = k.running ? `<span class="dot ok"></span>app running ${dur(k.elapsed)}` : `<span class="dot bad"></span>app not running`;
    const bt = (k.bluetooth || []).length ? k.bluetooth.map(esc).join(", ") : "none";
    html += `<div class="line"><span class="k">Kiosk</span>${st} · build ${esc(k.version || "?")} · Bluetooth: ${bt}</div>`;
  }
  const tasks = (m.tasks || []).filter((t) => t.state !== "waiting");
  if (!tasks.length) html += `<div class="empty">No build tasks running.</div>`;
  else {
    html += `<table><thead><tr><th>Running task / process</th><th class="n">#</th><th class="n">Running</th><th class="n">CPU</th><th class="n">Memory</th></tr></thead><tbody>`;
    for (const g of tasks) {
      const st = `<span class="badge ok">running${g.slot ? " · slot " + esc(g.slot) : ""}</span>`;
      const src = g.source === "process" ? ` <span class="muted" title="processes only, no remote.sh task marker">(no marker)</span>` : "";
      html += `<tr class="grp"><td colspan="2">${esc(g.checkout)} ${st}${src}${descHtml(g)}${g.command ? `<div class="cmd">${esc(g.command)}</div>` : ""}</td>` +
              `<td class="n">${dur(g.elapsed)}</td><td class="n">${cpu(g.cpu)}</td><td class="n">${g.rss ? bytes(g.rss) : ""}</td></tr>`;
      for (const kd of g.kinds) {
        html += `<tr><td title="${esc(kd.example)}">${esc(kd.kind)}</td><td class="n">${kd.count}</td><td class="n">${dur(kd.elapsed)}</td><td class="n">${cpu(kd.cpu)}</td><td class="n">${bytes(kd.rss)}</td></tr>`;
      }
    }
    html += `</tbody></table>`;
  }
  const queued = (q && q.queued) || [];
  if (queued.length) {
    html += `<h3>Queue <span class="badge warn">${queued.length} waiting for a build slot</span></h3>`;
    html += `<table class="queue"><thead><tr><th>#</th><th>Checkout / command</th><th class="n">Waiting</th><th class="n">Since</th></tr></thead><tbody>`;
    queued.forEach((w, i) => {
      const since = w.since ? new Date(w.since * 1000).toLocaleTimeString() : "?";
      html += `<tr><td class="n">${i + 1}</td><td><b>${esc(w.checkout)}</b>${w.command ? "" : ` <span class="muted">(no marker)</span>`}${descHtml(w)}${w.command ? `<div class="cmd">${esc(w.command)}</div>` : ""}</td>` +
              `<td class="n">${dur(w.elapsed)}</td><td class="n">${esc(since)}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += janitorLine((janitorState.machines || {})[m.name], now);
  if (m.stale_markers) html += `<div class="empty">${m.stale_markers} stale task marker${m.stale_markers === 1 ? "" : "s"} of ended runs ignored.</div>`;
  return html + `</div>`;
}

// Open questions for the user (parsed from SPECIFICATION.md by the dashboard),
// answerable here: an answer goes to test-output/answers/ of the main
// checkout (POST /api/answers with the token of config/dashboard-token).
let showDecided = false, questionsKey = "", lastQuestions = null, openGroups = null, answerMsg = {};
const drafts = {};
try { showDecided = localStorage.getItem("ocw-show-decided") === "1"; } catch (e) {}
function getToken() { try { return localStorage.getItem("ocw-answer-token") || ""; } catch (e) { return ""; } }
function setToken(t) { try { if (t) localStorage.setItem("ocw-answer-token", t); else localStorage.removeItem("ocw-answer-token"); } catch (e) {} }
// The question ids are sent back as they came (data attributes, escaped).
function qKey(id) { return "q-" + String(id).replace(/[^A-Za-z0-9]/g, "_"); }

function answerForm(it) {
  const k = qKey(it.id), a = it.answer;
  let html = "";
  if (it.answer_state === "answered") {
    html += `<div class="ans"><span class="badge warn">answered – waiting for the coordinator to record it in the spec</span>` +
      `<div class="anstext">${esc(a.answer)}</div><div class="muted">${esc(a.time)}</div></div>`;
  }
  const quick = [];
  if (it.proposal) quick.push(["Accept proposal", "Accept proposal: " + it.proposal]);
  (it.options || []).forEach((o, i) => quick.push([String.fromCharCode(65 + i) + ": " + o, o]));
  html += `<div class="af" data-q="${esc(it.id)}">`;
  if (quick.length) html += `<div class="quick">${quick.map(([label, text]) =>
    `<button type="button" class="qb" data-act="fill" data-text="${esc(text)}">${esc(label)}</button>`).join("")}</div>`;
  const draft = drafts[k] != null ? drafts[k] : "";
  html += `<textarea id="${k}" rows="2" placeholder="${it.answer_state === "answered" ? "Change the answer…" : "Your answer…"}" aria-label="Answer to ${esc(it.id)}">${esc(draft)}</textarea>` +
    `<div class="arow"><button type="button" class="send" data-act="send">${it.answer_state === "answered" ? "Send new answer" : "Send answer"}</button>` +
    `<span class="amsg">${esc(answerMsg[it.id] || "")}</span></div></div>`;
  return html;
}

function renderQuestions(q, force) {
  const el = $("questions");
  if (!q) { el.style.display = "none"; return; }
  el.style.display = "";
  lastQuestions = q;
  const answeredKey = (q.groups || []).map((g) => g.items.map((it) => it.answer ? it.answer.epoch : "").join(",")).join(";");
  const key = `${q.mtime}|${showDecided}|${q.error || ""}|${answeredKey}|${getToken() ? 1 : 0}`;
  if (key === questionsKey && !force) return;  // keeps opened groups and what is being typed
  questionsKey = key;
  // Keep drafts and opened groups over a re-render.
  el.querySelectorAll && el.querySelectorAll("textarea").forEach((t) => { drafts[t.id] = t.value; });
  if (el.querySelectorAll && el.innerHTML) openGroups = new Set([...el.querySelectorAll("details.qg[open]")].map((d) => d.dataset.g));
  const canAnswer = !!q.answers_enabled;
  let html = `<h2>Open questions <span class="badge ${q.open ? "warn" : "ok"}">${q.open} open</span>` +
    (q.answered ? `<span class="badge">${q.answered} answered</span>` : "") +
    `<span class="muted" style="font-size:12px;font-weight:400">${q.decided} decided · ${esc(q.source || "SPECIFICATION.md")}${q.spec_version ? " v" + esc(q.spec_version) : ""}</span>` +
    `<span class="tools"><label><input type="checkbox" id="show-decided"${showDecided ? " checked" : ""}> show decided</label></span></h2>`;
  if (q.error) html += `<div class="err">${esc(q.error)}</div>`;
  if (canAnswer && !getToken()) {
    html += `<div class="tokenbox"><label for="answer-token">To answer here, enter the token from <code>config/dashboard-token</code> once (kept in this browser):</label>` +
      `<div class="arow"><input id="answer-token" type="password" autocomplete="off" spellcheck="false"><button type="button" data-act="token">Save</button></div></div>`;
  } else if (canAnswer) {
    html += `<div class="muted" style="font-size:12px">Answers go to test-output/answers/ for the coordinator, who records them in the spec. <button type="button" class="linkb" data-act="forget">Forget token</button></div>`;
  }
  for (const g of q.groups || []) {
    const items = g.items.filter((it) => showDecided || it.status === "open");
    if (!items.length) continue;
    const isOpen = openGroups ? openGroups.has(g.group) : g.open > 0;
    html += `<details class="qg" data-g="${esc(g.group)}"${isOpen ? " open" : ""}><summary>${esc(g.group)} – ${esc(g.title)} ` +
      `<span class="muted">· ${g.open} open${g.decided ? `, ${g.decided} decided` : ""}${g.section ? ` · §14 ${esc(g.section)}` : ""}</span></summary>`;
    for (const it of items) {
      const note = it.status_note ? ` <span class="badge ${it.status === "open" ? "warn" : "ok"}">${esc(it.status_note)}</span>` : "";
      html += `<div class="q ${it.status}"><span class="qid">Q${esc(it.n)}</span><span class="qt">${esc(it.title)}</span>${note}` +
        `<div class="qtext">${esc(it.text)}</div>` +
        (it.proposal ? `<div class="qprop">Proposal: ${esc(it.proposal)}</div>` : "") +
        (it.status === "decided" && it.answer ? `<div class="qprop">Your answer (${esc(it.answer.time)}): ${esc(it.answer.answer)}</div>` : "") +
        (canAnswer && getToken() && it.status === "open" ? answerForm(it) : "") + `</div>`;
    }
    html += `</details>`;
  }
  const blocked = q.blocked || [];
  if (blocked.length) {
    html += `<h3>Blocked work</h3>` + blocked.map((b) =>
      `<div class="q"><span class="qid">Phase ${esc(b.phase)} ${esc(b.milestone)}</span>${esc(b.title)} <span class="badge warn">waits for ${b.waits_for.map(esc).join(", ")}</span></div>`).join("");
  }
  el.innerHTML = html;
  const sd = $("show-decided");
  if (sd) sd.addEventListener("change", (e) => {
    showDecided = e.target.checked;
    try { localStorage.setItem("ocw-show-decided", showDecided ? "1" : "0"); } catch (err) {}
    renderQuestions(q, true);
  });
}

async function sendAnswer(form) {
  const id = form.dataset.q, ta = form.querySelector("textarea"), text = ta.value.trim();
  if (!text) { answerMsg[id] = "Write an answer first."; renderQuestions(lastQuestions, true); return; }
  answerMsg[id] = "sending…";
  form.querySelector(".amsg").textContent = answerMsg[id];
  try {
    const r = await fetch("api/answers", { method: "POST", headers: { "Content-Type": "application/json", "X-OCW-Token": getToken() },
      body: JSON.stringify({ id, answer: text, choice: form.dataset.choice || null }) });
    const res = await r.json().catch(() => ({}));
    if (r.status === 403) { setToken(""); answerMsg[id] = "The token was not accepted – enter it again."; }
    else if (!r.ok) answerMsg[id] = "Not saved: " + (res.error || r.status);
    else { answerMsg[id] = "Saved " + res.answer.time + "."; drafts[ta.id] = ""; ta.value = ""; }
  } catch (e) { answerMsg[id] = "Not saved: " + e.message; }
  await refresh(true);
}

// One handler for every button of the panel (keyboard and touch: real buttons).
$("questions").addEventListener("click", (e) => {
  const b = e.target.closest ? e.target.closest("button[data-act]") : null;
  if (!b) return;
  const act = b.dataset.act, form = b.closest(".af");
  if (act === "token") { setToken(($("answer-token").value || "").trim()); renderQuestions(lastQuestions, true); }
  else if (act === "forget") { setToken(""); renderQuestions(lastQuestions, true); }
  else if (act === "fill" && form) {
    const ta = form.querySelector("textarea");
    ta.value = b.dataset.text; form.dataset.choice = b.dataset.text; drafts[ta.id] = ta.value; ta.focus();
  } else if (act === "send" && form) sendAnswer(form);
});

function renderJanitor(j, now) {
  const lv = j.levels || {};
  let html = `<h2>Janitor <span class="badge ${j.mode === "on" ? "ok" : "warn"}">${esc(j.mode || "off")}</span>` +
    `<span class="muted" style="font-size:12px;font-weight:400">target/ of merged or gone agent branches above ${esc(lv.merged ?? 75)} %, ` +
    `idle agent checkouts above ${esc(lv.lru ?? 85)} %, alert above ${esc(lv.alert ?? 92)} %</span></h2>`;
  const bits = [];
  if (j.last_pass) bits.push(`last pass ${dur(now - j.last_pass)} ago`);
  if (j.next_pass && j.mode !== "off") bits.push(`next pass at the earliest in ${dur(Math.max(0, j.next_pass - now))}`);
  if (j.test_output_bytes != null) bits.push(`test-output on the coordinator: ${bytes(j.test_output_bytes)} (kept)`);
  if (bits.length) html += `<div class="line">${bits.map(esc).join(" · ")}</div>`;
  const rec = (j.recent || []).slice().reverse();
  if (rec.length) {
    html += `<table><thead><tr><th>Time</th><th>Machine</th><th>What</th><th class="n">Size</th></tr></thead><tbody>` +
      rec.map((e) => `<tr><td class="n">${esc((e.time || "").slice(11, 16))}</td><td>${esc(e.machine)}</td>` +
        `<td>${esc(e.action)} ${esc(e.path || "")}<div class="cmd">${esc(e.reason || "")}</div></td>` +
        `<td class="n">${e.bytes ? bytes(e.bytes) : ""}</td></tr>`).join("") + `</tbody></table>`;
  } else html += `<div class="empty">No deletions yet.</div>`;
  $("janitor").innerHTML = html;
}

function render(st) {
  const now = st.generated_at, o = st.overview;
  janitorState = st.janitor || {};
  $("alerts").innerHTML = (st.alerts || []).length ?
    `<div class="alert">${st.alerts.map((a) => `<div>${esc(a.text)}</div>`).join("")}</div>` : "";
  const stats = [
    [`${o.online}/${o.machines}`, "machines online"],
    [o.tasks, "running"],
    [o.waiting, "waiting for a slot"],
    [`${o.slots_used} of ${o.slots_total}`, "build slots used"],
  ];
  if (o.questions_open != null) stats.push([o.questions_open, "open questions"]);
  $("overview").innerHTML = stats.map(([v, l]) => l === "open questions"
    ? `<a class="stat" href="#questions" style="color:inherit;text-decoration:none"><b>${esc(v)}</b><span>${esc(l)}</span></a>`
    : `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("");
  $("chips").innerHTML = st.machines.map((m) => {
    const n = (m.tasks || []).filter((t) => t.state !== "waiting").length, w = (m.queue || {}).waiting || 0;
    const cls = m.online ? (w ? "warn" : "ok") : m.online === false ? "bad" : "";
    const info = m.online ? `${n} task${n === 1 ? "" : "s"}${w ? `, ${w} waiting` : ""}` : (m.online === false ? "unreachable" : "…");
    return `<span class="chip"><span class="dot ${cls}"></span>${esc(m.name)} · ${info}</span>`;
  }).join("");
  $("cards").innerHTML = st.machines.map((m) => card(m, now)).join("");
  renderQuestions(st.questions);
  renderJanitor(janitorState, now);
  $("updated").textContent = "updated " + new Date(now * 1000).toLocaleTimeString();
}

async function refresh() {
  try {
    const r = await fetch("api/status", { cache: "no-store" });
    render(await r.json());
  } catch (e) {
    $("updated").textContent = "dashboard server not reachable (" + e.message + ")";
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
