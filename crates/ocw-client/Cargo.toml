[package]
name = "ocw-client"
description = "Open Cycling World client logic shared by the desktop and browser apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Shared by apps/desktop and apps/web (spec §14 Phase 10, 10B: one app,
# shared crates). Engine-free logic: it uses only ocw-render's view types
# (RideView parts), no Bevy systems. Builds for wasm32-unknown-unknown.
[dependencies]
ocw-core.workspace = true
ocw-sim.workspace = true
ocw-protocol.workspace = true
ocw-world.workspace = true
# The trusted user keys and the trust dialog's request (spec §4.7 *User
# keys*; its wasm32 part is pure).
ocw-worldstore.workspace = true
ocw-sky.workspace = true
ocw-weather.workspace = true
# Only the device events (no BLE stack on wasm32).
ocw-devices.workspace = true
ocw-render.workspace = true
# The server's shared labels (event distances); also the in-memory
# GameServer of the tests. Its lib builds for wasm32 (no QUIC there).
ocw-server.workspace = true
# Game audio (the mixer's messages) and voice (the controller), shared with
# the desktop since Phase 10 B5; both pure and wasm-safe.
ocw-audio.workspace = true
ocw-voice.workspace = true
# The settings registry's file format (settings.toml; localStorage in the
# browser).
toml.workspace = true
# The page's device facts for the quality preset's `auto` (B7).
serde_json.workspace = true
web-time.workspace = true
# The rider profiles (riders.toml) and the rides' sidecars (B6).
serde.workspace = true
# The ride's FIT file (pure; a download in the browser, B6).
ocw-fit.workspace = true
# Sign-in (spec §9.1): the Account page, the token set, the flows' forms.
ocw-auth.workspace = true

[lints]
workspace = true
