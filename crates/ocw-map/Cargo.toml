[package]
name = "ocw-map"
description = "The 2D map of a world package for Open Cycling World: geometry, projection, styles and a CPU rasteriser (studio map, HUD navigation map)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Pure dependencies only: this crate builds for wasm32-unknown-unknown (spec §3.5).
[dependencies]
ocw-world.workspace = true
# The CPU rasteriser of the map tiles and icons (BSD-3-Clause, pure Rust;
# already in the tree with these features, no PNG).
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }

[lints]
workspace = true
