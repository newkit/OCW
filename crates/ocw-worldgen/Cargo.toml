[package]
name = "ocw-worldgen"
description = "OSM and elevation import, road graph building and smoothing for world packages (spec §4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ocw-world.workspace = true
osmpbf = "0.3"
# GeoTIFF elevation grids (swissALTI3D, imported DGM1); pure Rust, MIT.
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
# LZW of tiled GeoTIFFs that the tiff crate refuses (no end code); MIT OR Apache-2.0.
weezl = "0.1"
thiserror.workspace = true
# Imagery index files (imagery.rs, spec §14 Phase 8 T3).
serde.workspace = true
serde_json.workspace = true
# Orthophoto cells from the WMS downloads (JPEG); pure Rust, MIT OR Apache-2.0 OR Zlib.
zune-jpeg = "0.5"

[dev-dependencies]
# End-to-end test (tests/e2e.rs): package, cache, load, ride on the server.
ocw-core.workspace = true
ocw-sim.workspace = true
ocw-server.workspace = true
ocw-worldstore.workspace = true
tempfile = "3"

[lints]
workspace = true
