[package]
name = "ocw-devices"
description = "Trainer and sensor access for Open Cycling World (no engine dependency)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
# The runner's streams and channels (no runtime: it runs on Tokio natively
# and on the browser's event loop in the browser app).
futures.workspace = true
# `Instant` that works on wasm32 too (std's panics there).
web-time.workspace = true

# The btleplug Bluetooth LE stack and the virtual trainer's thread are
# native only. On wasm32 (the browser app, spec §14 Phase 10 B4) the same
# GATT codecs (`gatt`), protocol (`ble::protocol`) and runner run over the
# browser's Web Bluetooth (`ble::web`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
btleplug.workspace = true
tokio.workspace = true

# Web Bluetooth: own bindings (web-sys has the Bluetooth classes only
# behind `web_sys_unstable_apis`, a cfg for the whole build), as for
# WebTransport in apps/web. Versions as in Cargo.lock (the wasm-bindgen
# CLI of `make web` must match exactly; apps/web pins it).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# ANT USB sticks over raw USB (spec 3.4.1, 14 Phase 17): nusb is pure Rust
# (MIT OR Apache-2.0; no libusb, which is LGPL-2.1 and C). Only the
# desktop app turns it on; everything else of `ant` is pure.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.nusb]
version = "0.2.9"
optional = true

# Garmin's libusb-win32 driver on Windows (spec 14 Phase 17 Q7 (d)): the
# system's libusb0.dll is loaded at run time (libloading: ISC); we ship and
# link nothing of libusb-win32 (LGPL).
[target.'cfg(windows)'.dependencies.libloading]
version = "0.8.9"
optional = true

[features]
ant-usb = ["dep:nusb", "dep:libloading"]

[dev-dependencies]
tracing-subscriber.workspace = true

# The workspace forbids unsafe code; here it is denied, and allowed only in
# `ant::libusb0`'s Windows FFI to libusb0.dll (as in ocw-xr-openxr).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[example]]
name = "ant"
required-features = ["ant-usb"]
