[package]
name = "ocw-devices"
description = "Trainer and sensor access for Open Cycling World (no engine dependency)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

# The Bluetooth LE stack (`ble`) and the virtual trainer's thread are
# native only; on wasm32 (the browser app, spec §14 Phase 10) the crate
# offers the device events, the GATT parsers (`gatt`) and the pure
# protocol (`ble::protocol` comes with B4's Web Bluetooth link).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
btleplug.workspace = true
futures.workspace = true
tokio.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[lints]
workspace = true
