[package]
name = "ocw-assets"
description = "Bike and rider 3D assets for Open Cycling World: glTF generator and reader, asset manifest and validator, riding animation (Bevy-free)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ocw-assets"
path = "src/bin/ocw-assets.rs"
required-features = ["tools"]

[features]
# The command-line tool: material fetch and conversion (download, zip,
# JPEG / PNG decoding, BC compression). The app (ocw-render) does not
# need them; it only reads the converted KTX2 files.
default = ["tools"]
tools = ["dep:image", "dep:texpresso", "dep:ureq", "dep:zip"]

[dependencies]
ocw-core.workspace = true
# The same glam as Bevy's (bevy_math), so poses need no conversion.
glam.workspace = true
# glTF 2.0 reader (MIT OR Apache-2.0), the version Bevy's loader uses; no
# `import` feature (no image decoding, no file access).
gltf.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
# Material library (spec §4.6, Phase 8 T1): pins and KTX2 reading.
sha2.workspace = true
ktx2.workspace = true
image = { workspace = true, optional = true }
texpresso = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[lints]
workspace = true
