[package]
name = "ocw-studio"
description = "OCW Studio: the editor for models, worlds and routes (spec §14 Phase 16)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ocw-studio"
path = "src/main.rs"

[dependencies]
# The document core: documents, commands, undo / redo, autosave (16A).
ocw-edit.workspace = true
# The Models workspace (16B, E3): the model files, their validator and
# diff (Phase 15), the rider's body and poses, the light model.
ocw-assets.workspace = true
ocw-core.workspace = true
ocw-sky.workspace = true
ocw-weather.workspace = true
ocw-sim.workspace = true
ocw-world.workspace = true
# The 2D map shared with the HUD's navigation map (spec §3.2).
ocw-map.workspace = true
ocw-worldstore.workspace = true
# The game's renderer: the world exactly as in a ride (16A).
ocw-render.workspace = true
# The unicorn flight input of Phase 13 (`ocw_ui::god::input`) and the
# shared world loading.
ocw-ui.workspace = true
# The game's local riders (`ocw_client::riders`, in ocw.toml): the rider
# the Routes workspace's expected time is for (16D).
ocw-client.workspace = true
# Bevy's full 2D, 3D and UI sets (gizmos, glTF, scenes), as before the
# browser's feature pruning (spec 14 Phase 10, 10G).
bevy = { workspace = true, features = ["2d", "3d", "ui"] }
bevy_egui.workspace = true
clap.workspace = true
dirs.workspace = true
# Decodes the orthophoto corridor's JPEG chunks for the map's aerial
# layer (16H Q15; already in the tree through ocw-render).
image.workspace = true
# The planner settings file (16H Q3) and BRouter's HTTP API (E2; native,
# rustls, already used by the game and the world store).
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
# Reads the riders' section of the game's ocw.toml.
toml.workspace = true

[build-dependencies]
# The logo icon and version info of the Windows .exe (spec §11.3).
ocw-winres.workspace = true

[lints]
workspace = true
