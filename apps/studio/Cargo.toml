[package]
name = "ocw-studio"
description = "OCW Studio: the editor for models, worlds and routes (spec §14 Phase 16)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ocw-studio"
path = "src/main.rs"

[dependencies]
# The document core: documents, commands, undo / redo, autosave (16A).
ocw-edit.workspace = true
# The Models workspace (16B, E3): the model files, their validator and
# diff (Phase 15), the rider's body and poses, the light model.
ocw-assets.workspace = true
ocw-core.workspace = true
ocw-sky.workspace = true
ocw-weather.workspace = true
ocw-sim.workspace = true
ocw-world.workspace = true
ocw-worldstore.workspace = true
# The game's renderer: the world exactly as in a ride (16A).
ocw-render.workspace = true
# The unicorn flight input of Phase 13 (`ocw_ui::god::input`) and the
# shared world loading.
ocw-ui.workspace = true
bevy.workspace = true
bevy_egui.workspace = true
clap.workspace = true
dirs.workspace = true
# The planner settings file (16H Q3) and BRouter's HTTP API (E2; native,
# rustls, already used by the game and the world store).
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true

[build-dependencies]
# The logo icon and version info of the Windows .exe (spec §11.3).
ocw-winres.workspace = true

[lints]
workspace = true
