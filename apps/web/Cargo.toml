[package]
name = "ocw-web"
description = "Open Cycling World in the browser (spec §14 Phase 10): Bevy on WebGPU, the local server in the frame loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The desktop's build script: OCW_COMMIT for the build id in the HUD.
build = "../desktop/build.rs"

[lib]
# cdylib: the .wasm for wasm-bindgen (`make web`); rlib: the native tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
ocw-core.workspace = true
ocw-sim.workspace = true
ocw-protocol.workspace = true
ocw-world.workspace = true
ocw-sky.workspace = true
# Device events and the frame-driven virtual trainer (no BLE on wasm32).
ocw-devices.workspace = true
ocw-render.workspace = true
# The client loop, shared with the desktop app.
ocw-client.workspace = true
# The GameServer as the in-browser local server (`local::FrameServer`).
ocw-server.workspace = true
# Worlds over HTTP (B2): range planning, verification, the chunk cache and
# the tile residency (its `stream` module; the rest is native only).
ocw-worldstore.workspace = true
bevy.workspace = true
clap.workspace = true
# `window.ocw.netStats()` (B3: the browser test reads the link's numbers).
serde_json.workspace = true

# In the browser only: Bevy on WebGPU (wgpu's browser backend) with the
# web platform glue; wasm-bindgen pinned to the version in Cargo.lock,
# which the wasm-bindgen CLI of `make web` must match exactly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu", "web"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# fetch() with ranges, the Origin Private File System, the storage
# estimate, the loading screen's element.
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "Navigator",
    "Performance",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "DomException",
    "StorageManager",
    "Blob",
    "File",
    "FileSystemHandle",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "WritableStream",
] }

[lints]
workspace = true
