[package]
name = "ocw-web"
description = "Open Cycling World in the browser (spec §14 Phase 10): Bevy on WebGPU, the local server in the frame loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The desktop's build script: OCW_COMMIT for the build id in the HUD.
build = "../desktop/build.rs"

[lib]
# cdylib: the .wasm for wasm-bindgen (`make web`); rlib: the native tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
ocw-core.workspace = true
ocw-sim.workspace = true
ocw-protocol.workspace = true
ocw-world.workspace = true
ocw-sky.workspace = true
ocw-weather.workspace = true
# Devices: the frame-driven virtual trainer and, on wasm32, Web Bluetooth
# (`ble::web`: the shared protocol over the browser's GATT objects, B4).
ocw-devices.workspace = true
ocw-render.workspace = true
# The client loop, shared with the desktop app.
ocw-client.workspace = true
# The desktop's menus, settings, time and weather machines, events and
# collisions (shared UI glue, B6) and the ride's FIT file.
ocw-ui.workspace = true
ocw-fit.workspace = true
# Game audio (the synthesised sounds and the mixer) and voice (the
# controller and the browser's livekit-client backend), shared with the
# desktop (B5).
ocw-audio.workspace = true
ocw-voice.workspace = true
web-time.workspace = true
# The GameServer as the in-browser local server (`local::FrameServer`).
ocw-server.workspace = true
# Worlds over HTTP (B2): range planning, verification, the chunk cache and
# the tile residency (its `stream` module; the rest is native only).
ocw-worldstore.workspace = true
bevy.workspace = true
clap.workspace = true
# `window.ocw.netStats()` (B3: the browser test reads the link's numbers).
serde_json.workspace = true

# The browser's GPU API (spec §14 Phase 10 B7): Bevy chooses WebGPU or
# WebGL 2 when it is compiled (its shaders and limits differ), so the page
# has two builds and loads the one the browser can run. A wasm32 build
# needs exactly one of them (`make web` builds both; `make test-web-build`
# the WebGPU one). Native builds (the tests) take neither: the features
# only reach wgpu's browser backends, and leaving them out keeps the
# workspace's Bevy the desktop's.
[features]
webgpu = ["bevy/webgpu"]
webgl2 = ["bevy/webgl2"]
# The public preview (spec §14 Phase 10 B8a, `make web-preview`): worlds
# must be signed by the web preview's root (`ocw-worldstore`'s
# keys/preview-roots.json), which replaces the production roots; the
# localhost-only trust options stay as they are.
preview = []

# In the browser only: Bevy's web platform glue; wasm-bindgen pinned to
# the version in Cargo.lock, which the wasm-bindgen CLI of `make web` must
# match exactly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# fetch() with ranges, the Origin Private File System, the storage
# estimate, the loading screen's element.
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "Navigator",
    "Performance",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "DomException",
    "StorageManager",
    "Blob",
    "File",
    "FileSystemHandle",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "WritableStream",
    # The remembered Bluetooth devices of this origin (B4).
    "Storage",
    # Game audio through Web Audio, the first gesture, the outputs (B5).
    "AudioContext",
    "BaseAudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioScheduledSourceNode",
    "AudioNode",
    "AudioDestinationNode",
    "Event",
    "EventTarget",
    "MediaDevices",
] }

[lints]
workspace = true
