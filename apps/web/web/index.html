<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Cycling World</title>
  <!-- No favicon yet: an empty one, so the browser asks for none (no 404). -->
  <link rel="icon" href="data:,">
  <!--
    The browser app (spec §14 Phase 10, B1 – B5). Served from target/web/ by
    `make web-serve` (worlds from target/web/worlds/, `world-builder
    publish` layout). Hosting later (B8) adds the headers for wasm threads:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Embedder-Policy: require-corp
    and a strict Content-Security-Policy ('wasm-unsafe-eval' for the module).
    Options in the query string: ?route=loop&bots=3&power=250&start=1.5&name=Ada&ftp=250
    Devices (B4): the panel bottom right opens the browser's Web Bluetooth
    chooser (Chrome / Edge); without Web Bluetooth it says so and the ride
    uses virtual power.
    A world package: ?world=liechtenstein&route=vaduz-malbun (dev pages on
    localhost also: allow-unsigned=1, trust=dev, trust-root=HEX).
    Sound and voice (B5): the game sound starts with the first click or key
    (the browser's autoplay rule); the "Sound & voice" panel sets the
    volumes and the voice switches (M / Shift+M) and runs the echo test.
    Voice uses LiveKit's JS SDK (livekit-client.umd.js, Apache-2.0, fetched
    and hash-checked by the build) through ocw-voice.js.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #10141a; color: #d8dee9;
      font: 16px system-ui, sans-serif; overflow: hidden; }
    #ocw-canvas { display: block; width: 100%; height: 100%; outline: none; }
    #ocw-status { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; text-align: left; padding: 16px; pointer-events: none;
      white-space: pre-line; line-height: 1.5; }
    #ocw-status.loading { background: rgba(16, 20, 26, 0.92);
      font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; }
    #ocw-status.error { color: #ffb4a8; background: rgba(16, 20, 26, 0.92); }
    #ocw-status[hidden] { display: none; }
    /* The devices panel (B4; a page overlay until the menus come, B6). */
    #ocw-devices { position: fixed; bottom: 28px; right: 12px; width: 340px;
      padding: 10px 12px; border-radius: 6px; background: rgba(10, 13, 18, 0.78);
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.45; }
    #ocw-devices[hidden], #ocw-devices-show[hidden] { display: none; }
    #ocw-devices header { display: flex; justify-content: space-between; align-items: center;
      font-weight: 600; margin-bottom: 6px; }
    #ocw-devices button, #ocw-devices-show { font: inherit; color: #d8dee9; cursor: pointer;
      background: #222a35; border: 1px solid #3b4656; border-radius: 4px; padding: 3px 7px; }
    #ocw-devices button:hover:not(:disabled) { background: #2c3644; }
    #ocw-devices button:disabled { opacity: 0.45; cursor: not-allowed; }
    #ocw-devices .add { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    #ocw-devices .dev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #ocw-devices .on { color: #a3d9a5; } #ocw-devices .wait { color: #ebcb8b; }
    #ocw-devices .note { color: #aab4c3; white-space: normal; margin-top: 4px; }
    #ocw-devices .err { color: #ffb4a8; white-space: normal; margin-top: 4px; }
    #ocw-devices-show { position: fixed; bottom: 28px; right: 12px; }
    /* The sound & voice panel (B5; a page overlay until the menus, B6). */
    #ocw-sound { position: fixed; bottom: 28px; right: 364px; width: 300px;
      padding: 10px 12px; border-radius: 6px; background: rgba(10, 13, 18, 0.78);
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.45; }
    #ocw-sound[hidden], #ocw-sound-show[hidden] { display: none; }
    #ocw-sound header { display: flex; justify-content: space-between; align-items: center;
      font-weight: 600; margin-bottom: 4px; }
    #ocw-sound h3 { font: inherit; font-weight: 600; margin: 8px 0 2px; color: #aab4c3; }
    #ocw-sound button, #ocw-sound-show, #ocw-sound select { font: inherit; color: #d8dee9;
      cursor: pointer; background: #222a35; border: 1px solid #3b4656; border-radius: 4px; padding: 2px 6px; }
    #ocw-sound select { max-width: 170px; }
    #ocw-sound label.row { display: flex; align-items: center; gap: 6px; }
    #ocw-sound label.row span { width: 64px; } #ocw-sound input[type=range] { flex: 1; }
    #ocw-sound output { width: 40px; text-align: right; }
    #ocw-sound .switches { display: flex; gap: 6px; flex-wrap: wrap; margin: 3px 0; }
    #ocw-sound .muted { color: #ff8a80; border-color: #8a3b36; }
    #ocw-sound .live { color: #a3d9a5; }
    #ocw-sound .hint { color: #10141a; background: #ebcb8b; border-radius: 4px; padding: 3px 6px; margin: 2px 0 4px; }
    #ocw-sound .note { color: #aab4c3; white-space: normal; }
    #ocw-sound-show { position: fixed; bottom: 28px; right: 100px; }
  </style>
  <!-- Voice (B5): LiveKit's JS SDK, then the shim the app talks to. -->
  <script src="livekit-client.umd.js"></script>
  <script src="ocw-voice.js"></script>
</head>
<body>
  <canvas id="ocw-canvas" tabindex="0"></canvas>
  <div id="ocw-status">Loading Open Cycling World …</div>
  <section id="ocw-devices" hidden aria-label="Devices">
    <header><span>Devices</span><button id="ocw-devices-hide" title="Hide">×</button></header>
    <div class="add">
      <button data-kind="trainer">+ Trainer</button>
      <button data-kind="power">+ Power meter</button>
      <button data-kind="hr">+ Heart rate</button>
    </div>
    <div id="ocw-devices-list"></div>
    <div id="ocw-devices-msg" class="note"></div>
  </section>
  <button id="ocw-devices-show" hidden>Devices</button>
  <section id="ocw-sound" hidden aria-label="Sound and voice">
    <header><span>Sound &amp; voice</span><button id="ocw-sound-hide" title="Hide">×</button></header>
    <div id="ocw-sound-hint" class="hint" hidden></div>
    <h3>Game sound</h3>
    <label class="row"><span>Master</span><input type="range" min="0" max="100" data-set="audio.master"><output></output></label>
    <label class="row"><span>Effects</span><input type="range" min="0" max="100" data-set="audio.effects"><output></output></label>
    <label class="row"><span>Riders</span><input type="range" min="0" max="100" data-set="audio.others"><output></output></label>
    <label class="row"><input type="checkbox" data-set="audio.mute"> Mute game sound</label>
    <div id="ocw-sound-status" class="note"></div>
    <h3>Voice</h3>
    <div id="ocw-voice-status" class="note"></div>
    <div class="switches">
      <button id="ocw-mic" title="M">Mic on</button>
      <button id="ocw-speaker" title="Shift+M">Speaker on</button>
    </div>
    <label class="row"><span>Voices</span><input type="range" min="0" max="200" step="5" data-set="voice.volume"><output></output></label>
    <label class="row"><input type="checkbox" data-set="voice.enabled"> Voice chat on</label>
    <label class="row"><input type="checkbox" data-set="voice.spatial"> Spatial (nearest riders louder)</label>
    <label class="row"><span>Mic</span><select data-set="voice.input"></select></label>
    <label class="row"><span>Speaker</span><select data-set="voice.output"></select></label>
    <label class="row"><input type="checkbox" id="ocw-echo"> Echo test
      <select id="ocw-echo-delay" title="Echo delay"><option>150</option><option>300</option><option>500</option><option>1000</option></select> ms</label>
    <div id="ocw-voice-people" class="note"></div>
  </section>
  <button id="ocw-sound-show" hidden>Sound</button>
  <script type="module">
    const status = document.getElementById("ocw-status");
    const fail = (msg) => { status.textContent = msg; status.className = "error"; console.error(msg); };
    if (!navigator.gpu) {
      fail("This browser has no WebGPU. Open Cycling World needs Chrome / Edge 113+, Safari 26 or Firefox 141+ (spec §14 Phase 10).");
    } else {
      const t0 = performance.now();
      performance.mark("ocw-import");
      try {
        const ocw = await import("./ocw_web.js");
        // window.ocw.console("teleport 3"), window.ocw.wasmMemory(): for tests.
        window.ocw = ocw;
        // Bevy's event loop throws a control-flow exception once it runs:
        // that is not an error.
        await ocw.default().catch((e) => {
          if (!String(e).includes("Using exceptions for control flow")) throw e;
        });
      } catch (e) {
        if (!String(e).includes("Using exceptions for control flow")) fail("Start failed: " + e);
      }
      performance.mark("ocw-started");
      console.log(`ocw-web: module started in ${(performance.now() - t0).toFixed(0)} ms`);
      // The app hides the status (or shows a world's loading screen in it).
      document.getElementById("ocw-canvas").focus();
      devicesPanel();
      soundPanel();
    }

    // The devices panel (spec §14 Phase 10 B4): the buttons open the
    // browser's chooser in their click handler (Web Bluetooth needs the
    // user gesture); the list follows window.ocw.devices() (JSON).
    function devicesPanel() {
      const panel = document.getElementById("ocw-devices");
      const show = document.getElementById("ocw-devices-show");
      const list = document.getElementById("ocw-devices-list");
      const msg = document.getElementById("ocw-devices-msg");
      const canvas = document.getElementById("ocw-canvas");
      const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
      const toggle = (on) => { panel.hidden = !on; show.hidden = on; canvas.focus(); };
      document.getElementById("ocw-devices-hide").onclick = () => toggle(false);
      show.onclick = () => toggle(true);
      const hasBt = !!navigator.bluetooth;
      for (const b of panel.querySelectorAll("button[data-kind]")) {
        b.disabled = !hasBt;
        b.onclick = () => {
          try {
            msg.className = "note";
            msg.textContent = window.ocw.connectDevice(b.dataset.kind);
          } catch (e) {
            msg.className = "err";
            msg.textContent = String(e);
          }
          const said = msg.textContent;
          setTimeout(() => { if (msg.textContent === said) msg.textContent = ""; }, 8000);
          canvas.focus();
        };
      }
      if (!hasBt) {
        msg.textContent = "This browser has no Web Bluetooth (Firefox, Safari, iOS): riding with virtual power (↑ / ↓, Page Up / Down). Trainers connect in Chrome or Edge.";
      }
      panel.hidden = false;
      const render = () => {
        let j;
        try { j = JSON.parse(window.ocw.devices() || "null"); } catch (e) { j = null; }
        if (!j) return;
        const rows = [];
        if (j.virtual) rows.push(`<div class="dev">○ Virtual power ${Math.round(j.virtual_w)} W</div>`);
        for (const d of j.devices) {
          const on = d.state === "connected";
          const what = on ? (d.kind || "") : d.state + " …";
          const value = d.power_w != null ? ` · ${Math.round(d.power_w)} W`
            : d.heart_rate_bpm != null ? ` · ${Math.round(d.heart_rate_bpm)} bpm` : "";
          rows.push(`<div class="dev ${on ? "on" : "wait"}" title="${esc(d.id)}">● ${esc(d.name)} – ${esc(what)}${value}</div>`);
        }
        rows.push(`<div class="dev">${esc(j.trainer)}</div>`);
        if (!j.devices.length && j.remembered.length) {
          rows.push(`<div class="note">Last used here: ${j.remembered.map((r) => esc(r.name)).join(", ")}</div>`);
        }
        if (j.bluetooth === "NoAdapter") rows.push(`<div class="err">No Bluetooth adapter (or Bluetooth is off).</div>`);
        list.innerHTML = rows.join("");
      };
      setInterval(render, 500);
    }

    // The sound & voice panel (spec §14 Phase 10 B5): every control runs a
    // console command (`set audio.master 60`, `voice.mute-mic` …), so the
    // settings are the app's (saved in localStorage); the panel follows
    // window.ocw.audio() and window.ocw.voice() (JSON).
    function soundPanel() {
      const $ = (id) => document.getElementById(id);
      const panel = $("ocw-sound"), show = $("ocw-sound-show"), canvas = $("ocw-canvas");
      const run = (line) => { window.ocw.console(line); };
      const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
      const toggle = (on) => { panel.hidden = !on; show.hidden = on; canvas.focus(); };
      $("ocw-sound-hide").onclick = () => toggle(false);
      show.onclick = () => toggle(true);
      for (const el of panel.querySelectorAll("[data-set]")) {
        const key = el.dataset.set;
        el.onchange = () => {
          const v = el.type === "checkbox" ? (el.checked ? "on" : "off") : (el.value || "default");
          run(`set ${key} ${v}`);
          canvas.focus();
        };
        if (el.type === "range") el.oninput = () => { el.nextElementSibling.textContent = el.value + " %"; };
      }
      $("ocw-mic").onclick = () => { run("voice.mute-mic"); canvas.focus(); };
      $("ocw-speaker").onclick = () => { run("voice.mute-speaker"); canvas.focus(); };
      $("ocw-echo").onchange = (e) => { run(e.target.checked ? "voice.echo on" : "voice.echo off"); canvas.focus(); };
      $("ocw-echo-delay").onchange = (e) => { run(`voice.echo delay ${e.target.value}`); canvas.focus(); };
      const set = (sel, value) => {
        const el = panel.querySelector(`[data-set="${sel}"]`);
        if (!el || el === document.activeElement) return;
        if (el.type === "checkbox") el.checked = !!value;
        else if (el.tagName === "SELECT") {
          if (el.value !== (value || "default")) el.value = value || "default";
        } else {
          el.value = value;
          el.nextElementSibling.textContent = value + " %";
        }
      };
      const options = (sel, names, chosen) => {
        const el = panel.querySelector(`[data-set="${sel}"]`);
        if (el === document.activeElement) return;
        const want = ["default", ...names, ...(chosen && !names.includes(chosen) ? [chosen] : [])];
        const have = [...el.options].map((o) => o.value);
        if (want.join("\n") !== have.join("\n")) {
          el.innerHTML = want.map((n) => `<option value="${esc(n)}">${n === "default" ? "default" : esc(n)}</option>`).join("");
        }
        el.value = chosen || "default";
      };
      panel.hidden = false;
      const render = () => {
        let a, v;
        try { a = JSON.parse(window.ocw.audio() || "null"); } catch (e) { a = null; }
        try { v = JSON.parse(window.ocw.voice() || "null"); } catch (e) { v = null; }
        if (a) {
          const hint = $("ocw-sound-hint");
          hint.hidden = !a.hint;
          hint.textContent = a.hint ? "▶ " + a.hint : "";
          set("audio.master", a.mix.master); set("audio.effects", a.mix.effects);
          set("audio.others", a.mix.others); set("audio.mute", a.mix.mute);
          $("ocw-sound-status").textContent = a.state === "running"
            ? `playing · ${Math.round(a.sample_rate)} Hz · ${a.lead_ms} ms ahead${a.underruns ? ` · ${a.underruns} gaps` : ""}`
            : a.state === "unavailable" ? "no Web Audio in this browser" : "waiting for a click or key";
        }
        if (v) {
          $("ocw-voice-status").textContent = v.available ? `voice: ${v.hud}` : `voice ${v.status}`;
          const mic = $("ocw-mic"), spk = $("ocw-speaker");
          mic.textContent = v.mic_muted ? "Mic muted (M)" : "Mic on (M)";
          mic.className = v.mic_muted ? "muted" : "live";
          spk.textContent = v.speaker_muted ? "Speaker muted (⇧M)" : "Speaker on (⇧M)";
          spk.className = v.speaker_muted ? "muted" : "live";
          set("voice.volume", v.volume); set("voice.enabled", v.enabled); set("voice.spatial", v.spatial);
          options("voice.input", v.inputs, v.input);
          options("voice.output", v.outputs, v.output);
          if ($("ocw-echo") !== document.activeElement) $("ocw-echo").checked = v.echo.on;
          const d = $("ocw-echo-delay");
          if (d !== document.activeElement && [...d.options].some((o) => o.value == v.echo.delay_ms)) d.value = String(v.echo.delay_ms);
          const people = v.participants.map((p) => `${p.mic_muted ? "🔇" : (v.speaking.includes(p.name) ? "🗣" : "•")} ${esc(p.name)}${p.muted_by_me ? " (muted by you)" : ""}`);
          const echo = v.echo.on ? [`echo test: ${esc(v.echo.status)}`] : [];
          $("ocw-voice-people").innerHTML = [...people, ...echo].join("<br>");
        }
      };
      setInterval(render, 500);
      render();
    }
  </script>
</body>
</html>
