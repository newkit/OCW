<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Cycling World</title>
  <!--
    The browser app (spec §14 Phase 10, B1). Served from target/web/ by
    `make web-serve`. Hosting later (B8) adds the headers for wasm threads:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Embedder-Policy: require-corp
    and a strict Content-Security-Policy ('wasm-unsafe-eval' for the module).
    Options in the query string: ?route=loop&bots=3&power=250&start=1.5&name=Ada
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #10141a; color: #d8dee9;
      font: 16px system-ui, sans-serif; overflow: hidden; }
    #ocw-canvas { display: block; width: 100%; height: 100%; outline: none; }
    #ocw-status { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; text-align: center; padding: 16px; pointer-events: none; }
    #ocw-status.error { color: #ffb4a8; }
  </style>
</head>
<body>
  <canvas id="ocw-canvas" tabindex="0"></canvas>
  <div id="ocw-status">Loading Open Cycling World …</div>
  <script type="module">
    const status = document.getElementById("ocw-status");
    const fail = (msg) => { status.textContent = msg; status.className = "error"; console.error(msg); };
    if (!navigator.gpu) {
      fail("This browser has no WebGPU. Open Cycling World needs Chrome / Edge 113+, Safari 26 or Firefox 141+ (spec §14 Phase 10).");
    } else {
      const t0 = performance.now();
      performance.mark("ocw-import");
      try {
        const ocw = await import("./ocw_web.js");
        // Bevy's event loop throws a control-flow exception once it runs:
        // that is not an error.
        await ocw.default().catch((e) => {
          if (!String(e).includes("Using exceptions for control flow")) throw e;
        });
      } catch (e) {
        if (!String(e).includes("Using exceptions for control flow")) fail("Start failed: " + e);
      }
      performance.mark("ocw-started");
      console.log(`ocw-web: module started in ${(performance.now() - t0).toFixed(0)} ms`);
      status.remove();
      document.getElementById("ocw-canvas").focus();
    }
  </script>
</body>
</html>
