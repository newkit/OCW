[package]
name = "ocw-desktop"
description = "Open Cycling World desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ocw-desktop"
path = "src/main.rs"

[dependencies]
ocw-core.workspace = true
ocw-sim.workspace = true
ocw-protocol.workspace = true
ocw-devices.workspace = true
ocw-world.workspace = true
# World clock, time zones, sun and light (spec §14 Phase 9).
ocw-sky.workspace = true
ocw-worldstore.workspace = true
ocw-render.workspace = true
ocw-server.workspace = true
bevy.workspace = true
# The version Bevy uses: probing window surfaces (`surface`).
wgpu = { version = "=30.0.1", default-features = false }
clap.workspace = true
raw-window-handle.workspace = true
winit.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
ocw-fit.workspace = true
tracing.workspace = true
serde_json.workspace = true
# Strava uploads (MIT OR Apache-2.0; rustls, no OpenSSL).
ureq.workspace = true
# Game audio output (Apache-2.0; spec §3.3).
cpal.workspace = true
# Voice chat logic (spec §7); the LiveKit backend only with `voice`.
ocw-voice.workspace = true

[features]
# Voice chat with the LiveKit Rust SDK (spec §7). Off by default; on Linux
# build with clang >= 21: `CXX=clang++-21 cargo build --features voice`.
voice = ["ocw-voice/livekit"]

[lints]
workspace = true
