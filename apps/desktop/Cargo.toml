[package]
name = "ocw-desktop"
description = "Open Cycling World desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ocw-desktop"
path = "src/main.rs"

[dependencies]
ocw-core.workspace = true
ocw-sim.workspace = true
ocw-protocol.workspace = true
ocw-devices.workspace = true
ocw-world.workspace = true
# World clock, time zones, sun and light (spec §14 Phase 9).
ocw-sky.workspace = true
ocw-weather.workspace = true
ocw-worldstore.workspace = true
ocw-render.workspace = true
# The parts catalogue, the bike generator and the workshop room (spec §14
# Phase 4, 4A–4I).
ocw-assets.workspace = true
# The client loop, events, god state and key logic (shared with apps/web).
ocw-client.workspace = true
# The shared UI glue: menu, settings, time and weather machines, events,
# collisions (shared with apps/web, spec §14 Phase 10 B6).
ocw-ui.workspace = true
# The game sounds and their mixer (shared with apps/web, spec §14 Phase 10 B5).
ocw-audio.workspace = true
ocw-server.workspace = true
bevy.workspace = true
# The version Bevy uses: probing window surfaces (`surface`).
wgpu = { version = "=30.0.1", default-features = false }
clap.workspace = true
winit.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
ocw-fit.workspace = true
tracing.workspace = true
serde_json.workspace = true
# Strava uploads (MIT OR Apache-2.0; rustls, no OpenSSL).
ureq.workspace = true
# Game audio output (Apache-2.0; spec §3.3).
cpal.workspace = true
# The clipboard for Ride -> Join's Paste and Host's Copy link (MIT OR
# Apache-2.0; the version egui already uses).
arboard = { version = "3.7", default-features = false }
# Voice chat logic (spec §7); the LiveKit backend only with `voice`.
ocw-voice.workspace = true
# VR (spec §14 Phase 11, X1): the pure parts; the OpenXR layer only with
# `vr`.
ocw-xr.workspace = true
ocw-xr-openxr = { workspace = true, optional = true }

# Sign-in (spec §9.1): the flows' forms and checks (ocw-auth), PKCE and
# state from the OS random source (getrandom), the session in the OS
# keyring (keyring, MIT OR Apache-2.0: the Secret Service over D-Bus on
# Linux – libdbus is linked already by btleplug –, the Keychain on macOS,
# the Credential Manager on Windows; a private file when none answers).
ocw-auth.workspace = true
getrandom.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[dev-dependencies]
# The sign-in end to end against the backend and its fake providers.
ocw-accounts.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
# Voice chat with the LiveKit Rust SDK (spec §7). Off by default; on Linux
# build with clang >= 21: `CXX=clang++-21 cargo build --features voice`.
voice = ["ocw-voice/livekit"]
# VR headsets over OpenXR (spec §14 Phase 11, X1): our own thin layer
# (openxr + a Vulkan device made through OpenXR, wrapped for wgpu). Off by
# default; `--vr-sim` works without it.
vr = ["ocw-render/openxr", "dep:ocw-xr-openxr"]

[lints]
workspace = true
