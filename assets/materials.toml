# The material library (spec §4.6, §13, Phase 8 T1): tiling PBR materials
# for the ground, the roads and (Phase 8 T4) the houses.
#
# The textures are not in git. Every source file is pinned here by URL (or as
# a member of a pinned archive) and SHA-256; `scripts/fetch-materials.sh`
# (`cargo run -p ocw-assets -- materials fetch`) downloads them once into a
# cache, checks the hashes, converts them to KTX2 (1024², mipmapped; albedo +
# roughness BC3 sRGB, normal BC5) and writes the git-ignored library folder
# `assets/materials/` with a copy of this manifest and CREDITS.md.
#
# Every entry needs `license`, `source` (the asset's page, where the licence
# was checked) and `author`; the validator (`ocw-assets materials validate`)
# rejects share-alike, non-commercial, no-derivatives and unknown licences
# (spec Phase 8A). `size_m` is the real-world size of one texture repeat.
#
# Licences checked on 2026-11-13 on each asset's page: ambientCG ("All assets
# are released under the Creative Commons CC0 license") and Poly Haven
# ("CC0 1.0 Universal - public domain dedication").
#
# Ids are fixed: the renderer's ground layers (meadow … wetland) and road
# layers (asphalt … dirt_road, ocw_world::RoadSurface) are found by id.

