# --- Regional material sets (spec §4.6; Phase 8 T3 extends them) -------------
# A set applies to packages whose time zone (section TZID) is listed: ground
# layer slots (meadow, farmland, forest_floor, rock, scree, gravel, sand,
# snow, wetland) are drawn with other materials, and land classes (default,
# meadow, …, bare, scrub) with another mix of the slots.

[[region]]
id = "volcanic"
name = "Volcanic islands (Canary Islands)"
time_zones = ["Atlantic/Canary"]
# Rock and scree are lava; gravel and loose ground volcanic ash and cinder
# (the Cañadas); sand and beaches (natural=beach → class bare) black sand;
# the forests Canary pine.
layers = { rock = "lava_rock", scree = "volcanic_ash", gravel = "volcanic_ash", sand = "black_sand", forest_floor = "pine_floor" }

[region.classes]
# Ground without land use: dry, half ash – the green north gets its meadows
# from OSM land use; T3 calibrates this from imagery.
default = { meadow = 0.45, gravel = 0.55 }
bare = { gravel = 0.5, sand = 0.5 }
scrub = { meadow = 0.4, gravel = 0.6 }
forest = { forest_floor = 0.85, gravel = 0.15 }
water = { sand = 0.7, rock = 0.3 }
