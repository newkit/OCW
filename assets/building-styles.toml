# Regional house styles (spec §4.6, §14 Phase 8 T4): how the houses of a
# region look where OSM does not say. Built into the app (ocw-render
# `house_style`); every tagged fact wins over these presets: roof:shape,
# roof:height / roof:angle / roof:levels, building:levels, building:material,
# building:colour, roof:material, roof:colour, and the roof colour measured
# in the orthophoto (package section ROOF, T3).
#
# A style applies to the packages whose time zone (section TZID) it lists,
# optionally only inside a latitude / longitude box (`bbox = [south, west,
# north, east]`) and only to buildings at or above `min_elevation_m`; of the
# matching styles the one with the highest `min_elevation_m` wins. The first
# style is the default for everything else.
#
# Presets are per building kind (other, house, apartments, commercial,
# industrial, farm, religious, public, small) or finer use (chalet,
# farmhouse, barn, garage, shed, church, chapel, greenhouse, canopy, hut,
# hotel, retail, terrace). Every field is optional and is looked up in order:
# the style's use, the style's kind, the default style's use (a garage stays a
# garage everywhere), the style's `other`, the default style's kind, the
# default style's `other`.
#
#   roofs          mix of roof shapes for untagged pitched roofs (gabled,
#                  hipped, half-hipped, pyramidal, skillion, mansard, gambrel;
#                  flat turns them flat), weights
#   pitch          factor on the builder's roof height (0.4 × the span)
#   eave_drop_m    the eaves come down this far (the ridge stays): big roofs
#   overhang_m     eaves and verges beyond the walls (near LOD)
#   parapet_m      low wall around flat roofs (near LOD)
#   walls          wall material mix (plaster, timber, stone, brick,
#                  concrete, metal, glass)
#   upper          material of the floors above the ground floor and of the
#                  gables, with its probability (e.g. { timber = 0.5 })
#   wall_colours   plaster colours (sRGB hex), one picked per building; other
#                  materials keep their own colour
#   roof_materials roof material mix (tiles, slate, metal, concrete, glass,
#                  wood, grass)
#   roof_colours   clay tile colours, one picked per building
#   window         window style (below; "none": no windows)
#   chimney        probability of a chimney on a pitched roof
#
# Colours were picked from reference photos (art/reference/<region>.md).

# --- Window styles (procedural façades in building.wesl; at most 16) -------
# One window per bay along a wall and storey; a door on the ground floor of
# one wall. Widths and heights in metres; `sill_m` above the storey's floor.

