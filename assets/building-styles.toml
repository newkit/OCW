# --- Default: Central European towns and valleys (Rhine valley, Vaduz,
# Freiburg): light plaster, red-brown clay tiles, gable and hipped roofs ----

[[style]]
id = "central"
name = "Central European towns and valleys"

[style.kind.other]
roofs = { gabled = 0.7, hipped = 0.3 }
pitch = 1.0
overhang_m = 0.45
parapet_m = 0.3
walls = { plaster = 1.0 }
wall_colours = ["#f1ece0", "#ece3cf", "#e9dcc0", "#f3efe6", "#e4e0d8", "#efe2c4", "#e8d6c0"]
roof_materials = { tiles = 1.0 }
roof_colours = ["#8e3b26", "#7a3324", "#9a4a2c", "#6e3a2c", "#5b4a43"]
window = "house"
chimney = 0.0

[style.kind.house]
roofs = { gabled = 0.65, hipped = 0.25, half-hipped = 0.1 }
overhang_m = 0.55
chimney = 0.6

[style.kind.terrace]
roofs = { gabled = 1.0 }

[style.kind.apartments]
roofs = { hipped = 0.5, gabled = 0.5 }
wall_colours = ["#f3efe8", "#ebe5d8", "#e6dfd0", "#efe6d2", "#dcd9d2"]
window = "apartments"
overhang_m = 0.4

[style.kind.hotel]
window = "apartments"

[style.kind.commercial]
roofs = { hipped = 0.5, gabled = 0.5 }
walls = { plaster = 0.6, concrete = 0.4 }
roof_materials = { tiles = 0.6, metal = 0.4 }
window = "shop"

[style.kind.retail]
window = "shop"

[style.kind.industrial]
roofs = { gabled = 1.0 }
pitch = 0.45
walls = { metal = 0.6, concrete = 0.4 }
roof_materials = { metal = 0.8, concrete = 0.2 }
