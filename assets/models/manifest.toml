# The shipped 3D models (spec §2.5, §8, §13). Every model file in this
# directory needs an entry with `license`, `source` and `author`; the asset
# validator (`cargo run -p ocw-assets -- validate`) rejects anything else.
# Cosmetic assets carry no physics: a bike names its physics profile, the
# server takes the values from its own table.
#
# All models here are generated by crates/ocw-assets
# (`cargo run -p ocw-assets -- generate`): own work, licensed like the code.

[[asset]]
file = "bike-road.glb"
kind = "bike"
profile = "road"
license = "MIT OR Apache-2.0"
source = "generated: crates/ocw-assets/src/bikes.rs"
author = "Open Cycling World contributors"

