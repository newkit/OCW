# The parts catalogue of the workshop (spec §14 Phase 4, 4B, 4H, 4I).
#
# One [[part]] per catalogue entry. Names are generic and unbranded (spec
# Phase 8 Q11: no real brands in the game); `hearts` is ceil(median EUR) of
# the real reference products in assets/parts-sources.toml (key `sources`;
# 1 heart = 1 EUR, rounded up). Never edit it by hand: run
# `cargo run -p ocw-assets -- parts reprice` after changing the sources;
# `cargo run -p ocw-assets -- parts validate` checks the file (ids, prices,
# base parts, the brand deny-list, model references, source age).
#
# Keys: id (`<slot>.<kind>[.<tier>]`, stable, never reused), slot, tier
# (base, entry, mid, upper, top), name, hearts, weight_g (typical; pairs for
# wheels, tyres, pedals), fits (bike types: road, tt, gravel, mtb), standard
# (optional: speeds, shifting, brake, wheel, width_mm, family), profile
# (frames: the physics profile, spec §2.5), rolling / aero / efficiency
# (class steps, 4G; physics from W3), model (frames: the bike model
# bike-<profile>; base parts: "stock", the frame's own part; others: a part
# variant of the generator, crates/ocw-assets/src/bikes.rs), sources, priced.
#
# Base parts (tier base, 0 hearts) are the stock parts every frame comes
# with: one per slot and bike type, so a bike is always complete. Weights
# are typical catalogue values, to be confirmed with the price research.

# --- Base parts --------------------------------------------------------------

