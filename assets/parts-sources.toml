# Price references of the parts catalogue (spec §14 Phase 4, 4H): the real
# products each generic in-game part is priced from. Research data only:
# the brand and product names here never appear in the game, the assets or
# the UI (assets/parts.toml uses generic names; `ocw-assets parts validate`
# checks it against a deny-list of these brands).
#
# Per source: `key` (named by a part's `sources`), `checked` (date of the
# research), optional `multiply` (2 for pairs priced per piece, e.g. tyres)
# and the references, either as one `refs` list or as several
# `[[source.group]]`s whose medians are added (bar + stem). A part's hearts
# are ceil(median) – of all references of a group (two references: their
# mean), groups summed, times `multiply`, rounded up to whole hearts.
# `cargo run -p ocw-assets -- parts reprice` rewrites assets/parts.toml
# from this file; re-research by hand about twice a year (4H).
#
# kind: R = manufacturer list / launch RRP or a UVP shown by a retailer;
# R* = list price reported by a third party, not verified on the brand's
# page; S = street price (only where no RRP was found).
# via: SRAM-25 = SRAM MSRP price list 2025 (EUR incl. VAT, slowtwitch.com);
# BR = BikeRadar; bc = bike-components.de (UVP); Rose = rosebikes.de (UVP);
# Mantel = mantel.com RRP; 99s = 99spokes; brand = the brand's own page /
# launch price.

