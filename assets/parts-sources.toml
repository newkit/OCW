# Typical weights (helmets size M, shoes pair EU 42):
# weight apparel.jersey.thermal = 300 g – road.cc measured 285 g for the Gore C5 Thermo (size M)
# weight apparel.jersey.aero = 120 g – typical for lightweight race jerseys (100–140 g), estimate
# weight apparel.jersey.skinsuit = 210 g – Castelli lists 207 g for its Sanremo Ultra speed suit
# weight apparel.shorts.tights = 330 g – typical winter bib tights with chamois (280–380 g), estimate
# weight apparel.shorts.aero = 180 g – typical race bib shorts (150–200 g), estimate
# weight apparel.socks.tall = 50 g – typical merino winter pair, estimate
# weight apparel.socks.aero = 30 g – typical thin aero pair, estimate
# weight apparel.shoes.race = 460 g – Fizik claims 225 g per shoe (size 42) for Vento Infinito Knit Carbon 2; S-Works/S-Phyre ~230–250 g per shoe
# weight apparel.shoes.overshoes = 60 g – lycra TT/aero overshoe pair, estimate
# weight apparel.gloves.gel = 50 g – typical gel mitt pair, estimate
# weight apparel.gloves.full = 60 g – Castelli Perfetto Light listed 41 g (likely single glove/size S); typical pair 50–80 g
# weight apparel.gloves.winter = 150 g – typical insulated winter pair (120–180 g), estimate
# weight apparel.helmet.light = 235 g – MET claims 225 g (M) for Trenta 3K Carbon MIPS; reviews measure 230–285 g
# weight apparel.helmet.aero-road = 280 g – typical aero road M (Evade/Eclipse/Ventral Air 260–300 g), estimate
# weight apparel.helmet.tt = 400 g – Kask Bambino Pro Evo M listed 360 g; Drone/Aerohead heavier (~400–550 g)
# weight apparel.cap.cotton = 45 g – typical cotton cycling cap, estimate
