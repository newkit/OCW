# God mode (spec §14 Phase 13): the rider turns into the unicorn and flies.
[[scene]]
name = "god-unicorn-flight"
description = "God mode (spec §14 Phase 13): the rider as the unicorn – white body, spiral golden horn, rainbow mane and tail, feathered pegasus wings – flying low over Vaduz towards the mountains, rainbow trail, flight HUD"
world = true
args = ["--world", "{world}", "--no-neighbours", "--free-ride", "--start", "-2430,2220", "--bots", "3"]
at = ["1=time 14:00", "3=god on", "4=god.pose -2650 2330 70 80 -10", "4.3=god.cruise 0.5 0.1 4"]
shot = 9

[[scene]]
name = "god-unicorn-side"
