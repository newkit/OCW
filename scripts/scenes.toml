# --- Collisions (spec §14 Phase 12, K1 / K2) --------------------------------

[[scene]]
name = "collision-bump-video"
description = "Video: a soft bump in a bunch on the Loop test route (dev.bump, spec §14 Phase 12 K1): a bot rubs shoulders with the rider, both are pushed apart and wobble, autodrive bots pass on the left"
args = ["--route", "loop", "--bots", "12", "--power", "230"]
at = ["9=camera.orbit 60 16 7", "10.5=dev.bump", "12.5=dev.bump"]
warmup = 9
video = 6

[[scene]]
name = "collision-crash-video"
description = "Video: a crash in a bunch (dev.crash, spec §14 Phase 12 K2): a bot cuts in, wheel touch, the rider falls as an Avian ragdoll with the bike, lies, picks the bike up and rides on; the bunch steers round the fallen bike"
args = ["--route", "loop", "--bots", "12", "--power", "230"]
at = ["9=camera.orbit 70 18 9", "10=dev.crash"]
warmup = 9
video = 10

[[scene]]
name = "collision-crash"
description = "Down after a crash in a bunch (spec §14 Phase 12 K2): the rider and bike as a ragdoll on the Loop test route, the HUD's crash line counting the time down"
args = ["--route", "loop", "--bots", "12", "--power", "230"]
at = ["9=camera.orbit 70 18 9", "10=dev.crash"]
shot = 12.5

# --- Workshop (spec §14 Phase 4, W1 scene, W2 parts) -------------------------

[[scene]]
name = "workshop-overview"
description = "Workshop scene (spec §14 Phase 4, W1): the generated workshop, the road bike on the repair stand, the other five starter bikes on the wall hooks with name cards, hearts balance and the live ride window"
args = ["--route", "hills", "--bots", "3", "--power", "250"]
at = ["2=workshop open"]
shot = 6

[[scene]]
name = "workshop-wall"
description = "Workshop scene: the camera panned along the bike wall to the third starter bike, its card grown (name, type and profile, weight, parts value)"
args = ["--route", "hills", "--bots", "3", "--power", "250"]
at = ["2=workshop open", "2.6=workshop right", "3.4=workshop right"]
shot = 20

[[scene]]
name = "workshop-stand-hotspots"
description = "Workshop scene: the stand view orbiting the road bike, the part hotspots (frame, wheels, tyres, groupset … lights, computer, bag, paint) with the focused one's label"
args = ["--route", "hills", "--bots", "3", "--power", "250"]
at = ["2=workshop open", "2.6=workshop select", "3.6=workshop orbit 25", "4=workshop slot-next"]
shot = 20

[[scene]]
name = "workshop-picker"
description = "Workshop part close-up (spec §14 Phase 4, W2): the wheels of the road bike with the part picker (equipped / shop, prices in hearts, locks) and the detail card; a carbon wheelset previewed live on the bike"
args = ["--route", "hills", "--bots", "3", "--power", "250"]
at = ["2=hearts.grant 3000", "2.2=workshop open", "2.8=workshop select", "3.8=workshop slot-next", "4.2=workshop select", "5=workshop down", "5.4=workshop down", "5.8=workshop down"]
shot = 22

[[scene]]
name = "workshop-swap-video"
description = "Video: the workshop scene, cycling through the starter bikes on the wall and swapping two onto the repair stand (1.2 s lift and clamp), then the stand view"
args = ["--route", "hills", "--bots", "3", "--power", "250"]
at = ["2=workshop open", "3.5=workshop right", "4.5=workshop right", "5.5=workshop select", "8=workshop right", "9=workshop right", "10=workshop right", "11=workshop select", "13.5=workshop select"]
warmup = 2
video = 14

# --- Phase 4 W4: the character corner ---------------------------------------

[[scene]]
name = "workshop-mirror"
description = "Character corner (spec §14 Phase 4, W4): the rider stands in front of the changing corner's mirror, seen over the shoulder and in the mirror from the front (planar reflection, a second camera at half resolution) – a strong build with a ponytail, the aero jersey, aero bib shorts and the time-trial helmet bought with hearts; the rider's five hotspots (head, torso, hands, legs, feet)"
args = ["--route", "hills", "--bots", "3", "--power", "250"]
at = ["2=hearts.grant 2000", "2.1=workshop.buy helmet.tt.top", "2.2=workshop.buy jersey.aero.upper", "2.3=workshop.buy shorts.aero.upper", "2.4=character --build strong --hair 4 --hair-colour #B3482A --skin 6", "2.6=workshop open", "3.2=workshop mirror"]
shot = 22

[[scene]]
name = "workshop-helmet-picker"
description = "Character corner: the helmet picker (equipped base helmet, the shop's helmets by price with their benefit by speed – watts at 25 / 35 / 45 km/h and the speed gain on the flat and at 6 %), the time-trial helmet previewed live on the rider in the mirror"
args = ["--route", "hills", "--bots", "3", "--power", "250"]
at = ["2=hearts.grant 1000", "2.2=workshop open", "2.8=workshop mirror", "4.5=workshop select", "5=workshop down", "5.4=workshop down", "5.8=workshop down"]
shot = 45

[[scene]]
name = "workshop-try-on"
description = "Character corner: Try on the bike – the rider (1.92 m, raised saddle) on the road bike on the repair stand, pedalling slowly in the riding animation, in a skinsuit and the aero road helmet"
args = ["--route", "hills", "--bots", "3", "--power", "250"]
at = ["2=hearts.grant 2000", "2.1=workshop.buy jersey.skinsuit.top", "2.2=workshop.buy helmet.aero-road.top", "2.3=workshop.buy socks.aero.upper", "2.4=character --face 2 --hair 2", "2.6=workshop open", "3.2=workshop mirror", "4.6=workshop slot-prev", "5=workshop select"]
riders = """
active = "Tall"

[[rider]]
name = "Tall"
weight_kg = 82.0
height_cm = 192.0
"""
shot = 45

[[scene]]
name = "workshop-kit-video"
description = "Video (spec §14 Phase 4, W4): the character corner – to the mirror, the helmet picker with the live preview (aero road, light, time-trial helmet), buying the time-trial helmet, a skinsuit and a new hairstyle, then Try on the bike: pedalling slowly on the repair stand, and back to standing"
args = ["--route", "hills", "--bots", "3", "--power", "250"]
at = ["2=hearts.grant 3000", "2.4=workshop open", "3.4=workshop mirror", "5.6=workshop select", "6.6=workshop down", "7.6=workshop down", "8.6=workshop down", "9.6=workshop.buy helmet.tt.top", "10.6=workshop back", "11.2=workshop.buy jersey.skinsuit.top", "12.2=character --hair 5", "13.2=character --hair 4 --hair-colour #D8B27A", "14.2=workshop slot-prev", "14.8=workshop select", "20.5=workshop back"]
warmup = 2
video = 22

# --- Phase 4 W3: build physics, race modes ------------------------------------

[[scene]]
name = "workshop-picker-effect"
description = "Workshop part picker (spec §14 Phase 4, W3): the road bike's tyres, the race tyres focused with the stock tyres pinned – the card's speed line from the server's build physics (+% flat, +% at 6 %), the bike's mass and speed against the stock bike, and the compare card's speed difference"
args = ["--route", "hills", "--bots", "3", "--power", "250"]
at = ["2=hearts.grant 3000", "2.2=workshop open", "2.8=workshop select", "3.8=workshop slot-next", "4.2=workshop slot-next", "4.6=workshop select", "5.6=workshop compare", "6=workshop down", "6.4=workshop down", "6.8=workshop down"]
shot = 22

[[scene]]
name = "sprint-open-video"
description = "Video (spec §14 Phase 4, W3): a race in Open mode on the Loop test route between two bots at a steady 300 W on the road bike – 'Stock' in the left lane and 'Upgraded' in the right lane (the capped best build: carbon wheels, race tyres, top groupset, integrated cockpit …, +1.4 % on the flat) – out of each other's draft; you ride between them at 300 W on the stock bike, and the upgraded bot pulls away"
args = ["--route", "loop", "--bots", "2", "--power", "300"]
at = ["1=dev.bot_bike 1 --bike road --power 300 --lane -2.4 --name Stock", "1=dev.bot_bike 2 --bike road --best --power 300 --lane 2.4 --name Upgraded", "1.5=event race --km 0.6 --physics open"]
warmup = 2
video = 40

[[scene]]
name = "sprint-open-results"
description = "Results of the 0.6 km race in Open mode (spec §14 Phase 4, W3): 'Upgraded' (best build, 300 W) ahead of 'Stock' and you (stock road bikes, 300 W) by the build's speed difference"
args = ["--route", "loop", "--bots", "2", "--power", "300"]
at = ["1=dev.bot_bike 1 --bike road --power 300 --lane -2.4 --name Stock", "1=dev.bot_bike 2 --bike road --best --power 300 --lane 2.4 --name Upgraded", "1.5=event race --km 0.6 --physics open"]
shot = 85

[[scene]]
name = "sprint-profile-results"
description = "The same race in Profile mode, the default for races (spec §14 Phase 4, W3): only the frame's profile counts, so 'Upgraded' and 'Stock' finish in the same time"
args = ["--route", "loop", "--bots", "2", "--power", "300"]
at = ["1=dev.bot_bike 1 --bike road --power 300 --lane -2.4 --name Stock", "1=dev.bot_bike 2 --bike road --best --power 300 --lane 2.4 --name Upgraded", "1.5=event race --km 0.6"]
shot = 85
