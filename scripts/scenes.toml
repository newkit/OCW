# --- Sky and time (spec §14 Phase 9, S1 / S3) -------------------------------
# Fixed instants on 21 June 2026 in Vaduz (sunrise 05:26, sunset 21:21 CEST),
# the clock paused so the light is exact; `time` resolves local times in the
# world's zone (Europe/Vaduz).

[[scene]]
name = "sky-sunrise"
description = "Sunrise on the Vaduz-Malbun road (21 June, 05:40 CEST): low warm sun from the north-east over the Rhine valley, long shadows, HUD clock"
