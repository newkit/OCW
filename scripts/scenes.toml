# --- Simulated aircraft (spec 14 Phase 18, 18E T8) ---------------------------
# The aerodromes come from the package's AERO section (`world-builder
# traffic`, T2); a package without it gets the airports of the NEARBY table
# (TFN and TFS for Tenerife). `air` lists what flies, `air.spot` puts the
# unicorn beside the path of the nearest aircraft of a kind or mission.

[[scene]]
name = "air-tfn-approach"
description = "Video: an airliner on the 3° glide slope to Tenerife North (runway 30, the wind from the north-west) passes the hovering unicorn at 220 m, gear down, over La Laguna (spec 18C, T8)"
world = "tenerife"
args = ["--world", "{world}", "--free-ride", "--start", "15000,-20000", "--bots", "0", "--power", "0"]
at = ["0.5=time 2026-07-15 10:00", "0.5=weather clear wind=6 dir=300", "0.5=hud off", "0.5=hud.profile off", "1=character --hair long --hair-colour auburn --glasses 1", "2=god.flight hover", "3=god on", "4=air.spot arrival 220 12", "4.2=air"]
video = 14
warmup = 5
pick = false

[[scene]]
name = "air-contrails-blackforest"
description = "A cold, humid November morning over the Black Forest: the airliners on the Rhine valley airways draw long persistent contrails that drift with the wind aloft (Schmidt–Appleman, spec 18C, T8); the unicorn looking up from 600 m"
world = "blackforest-north"
args = ["--world", "{world}", "--free-ride", "--bots", "0", "--power", "0"]
at = ["0.5=time 2026-11-27 10:30", "0.5=weather clear clouds=0.25 type=cirrus temp=2 humidity=0.85 wind=6 dir=250", "0.5=hud off", "0.5=hud.profile off", "1=character --hair-colour black --glasses 1", "2=god.flight hover", "3=god on", "4=god.pose here here 600 200 22", "4.5=air"]
shot = 12
pick = false

