# Scenes for the scene-rendering harness (scripts/render-scenes.sh, `make
# test-scenes`; README.md, "Scene harness"). Each [[scene]] is rendered headlessly
# by .claude/skills/run-ocw/drive.sh into test-output/scenes/<time>/NAME.jpg
# (screenshot, JPEG with EXIF time) and/or NAME.mp4 (video with sound; NAME.jpg
# is then its last frame).
#
# Keys of a scene ([defaults] gives defaults; args/cmds/at are prepended):
#   name         file name, for --only (globs: --only 'menu-*')
#   description  what the image shows (also the build-history README row)
#   world        true: needs the Liechtenstein package ({world}, {world_dir} in
#                args, cmds and at are replaced by its path and folder; the
#                Vaduz-Malbun route file lies beside it); "blackforest": the
#                Black Forest package instead ("blackforest-middle", "-north":
#                its neighbours), "tenerife": Tenerife; skipped without the package
#   args         ocw-desktop arguments (README, "Command-line options")
#   cmds         console commands at startup (--cmd)
#   at           timed console commands "SECONDS=COMMAND" (--at, game time
#                since the app started; world packages load for 1-3 s first)
#   shot         take a screenshot after this many seconds (real time)
#   video        record this many seconds of game time (25 fps frame capture)
#   warmup       seconds of game time before the video starts (default 3)
#   riders       content of riders.toml (rider profiles) for this scene
#   max_video_mb --pick re-encodes larger videos (default 3)
#   pick         false: never picked (--pick) for the build history
#
# Every scene runs with fresh config/data folders (no settings, devices,
# ghosts or saved rides of the machine's user) and the virtual trainer.

[defaults]
args = ["--virtual", "--window", "2560x1440"]

# --- Test route (no world package needed) -----------------------------------

