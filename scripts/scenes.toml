world = true
args = ["--world", "{world}", "--no-neighbours", "--free-ride", "--start", "-2430,2220", "--bots", "0"]
at = ["1=time 14:00", "3=god on", "4=god.pose -2500 2250 25 120 -25", "4.3=god.cruise 1 0 25"]
