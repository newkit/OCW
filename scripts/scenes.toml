at = ["0.5=time pause", "0.5=time 2026-06-21 15:00", "0.5=status.sign voice on", "1.5=dev.bot_bike 1 --power 220 --lane -0.9", "1.5=dev.bot_bike 2 --power 220 --lane 0.9", "2=dev.bot_status --bot 1 --not-hearing 3", "2=dev.bot_status --bot 2 --not-hearing 99", "3=camera.orbit 20 18 10"]
