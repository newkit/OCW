description = "Roads: the yellow Swiss/Liechtenstein zebra crossing on the Äulestrasse in Vaduz (crossing:markings=zebra), seen from above the road"
world = true
args = ["--world", "{world}", "--no-neighbours", "--free-ride", "--start", "-2424,2238", "--bots", "0", "--power", "0"]
at = ["0.5=time pause", "0.5=time 2026-07-15 12:00", "0.5=hud off", "0.5=hud.profile off", "1=camera.orbit 170 32 18"]
shot = 9

[[scene]]
name = "road-freiburg-centre"
description = "Roads, Black Forest: the Werthmannstraße at the Rotteckring in Freiburg (exclusive cycle lane, signalled crossings, sidewalks), 15 July, noon"
world = "blackforest"
args = ["--world", "{world}", "--no-neighbours", "--free-ride", "--start", "-8560,-7895", "--bots", "0", "--power", "0"]
at = ["0.5=time pause", "0.5=time 2026-07-15 12:00", "0.5=hud off", "0.5=hud.profile off", "1=camera.orbit 160 20 22"]
shot = 10

[[scene]]
name = "road-country"
description = "Roads: the Vaduz - Malbun road at km 6.5 above Triesenberg (country road): centre line, the road edge sloping into the meadow as a verge"
world = true
args = ["--world", "{world}", "--route-file", "{world_dir}/vaduz-malbun.route", "--no-neighbours", "--bots", "0", "--power", "0"]
