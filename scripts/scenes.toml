world = true
args = ["--world", "{world}", "--route-file", "{world_dir}/vaduz-malbun.route", "--no-neighbours", "--bots", "3", "--power", "200"]
at = ["2=time pause", "2=time 2026-06-21 12:00", "2.6=time golden-hour", "2.5=teleport 1.6", "2.5=camera.orbit 160 14 14"]
shot = 9

[[scene]]
