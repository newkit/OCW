# --- Real weather (spec §14 Phase 9, S7): from the providers, via the server -
# `weather real [SOURCE]` asks the local server to fetch the weather of the
# place (the rider's 0.1° cell) and the clock's moment: live data, so these
# scenes show the weather of the day they are rendered (the screenshot runs
# start without real weather; --real-weather true would start with it).
# `weather day NAME|DATE TIME` rides a day: the time machine goes there and
# the weather comes from ERA5 (Open-Meteo's historical API).

