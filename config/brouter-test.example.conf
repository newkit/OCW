# Settings of scripts/brouter-test-server.sh (our own BRouter for the
# planner tests, spec 16H Q22 (a)): the machine's paths and the port.
#
# Copy it to ~/.config/ocw/brouter-test.conf on the build machine (config/
# is never copied there by scripts/remote.sh), or to config/brouter-test.conf
# for a run in this checkout, or name it with OCW_BROUTER_CONFIG. KEY=VALUE
# per line, `#` starts a comment, a leading `~/` is the home folder. An
# environment variable of the same name wins over the file. The values below
# are the defaults.

# The folder with our OSM extract, our SRTM .hgt tiles and the world package
# (scripts/fetch-pilot.sh liechtenstein, scripts/build-liechtenstein.sh).
BROUTER_DATA=data/pilot

# The OSM extract the segments are built from (one .osm.pbf).
BROUTER_PBF=data/pilot/liechtenstein.osm.pbf

# The folder with the SRTM .hgt tiles (1" or 3"; e.g. N47E009.hgt) – the
# DEM the world builder uses outside swissALTI3D. Every .hgt there is used.
BROUTER_DEM=data/pilot

# The package the planned route is checked against (its route
# "Vaduz - Malbun").
BROUTER_PACKAGE=data/pilot/liechtenstein.ocwpkg

# Where BRouter, its profiles and the built segments are kept.
BROUTER_CACHE=~/.cache/ocw/brouter-test

# The server's port and address (only the loopback by default).
BROUTER_PORT=17777
BROUTER_BIND=127.0.0.1

# Java 11 or newer, and the map tool's heap (the 1" elevation tile needs
# about 1 GB).
BROUTER_JAVA=java
BROUTER_XMX=3g
