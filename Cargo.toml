[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/spike",
    "apps/world-builder",
    "services/server",
    "crates/ocw-core",
    "crates/ocw-sim",
    "crates/ocw-protocol",
    "crates/ocw-devices",
    "crates/ocw-world",
    "crates/ocw-render",
    "crates/ocw-worldgen",
    "crates/ocw-fit",
    "crates/ocw-worldstore",
    "crates/ocw-assets",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ocw-core = { path = "crates/ocw-core" }
ocw-sim = { path = "crates/ocw-sim" }
ocw-protocol = { path = "crates/ocw-protocol" }
ocw-devices = { path = "crates/ocw-devices" }
ocw-world = { path = "crates/ocw-world" }
ocw-worldgen = { path = "crates/ocw-worldgen" }
ocw-fit = { path = "crates/ocw-fit" }
ocw-worldstore = { path = "crates/ocw-worldstore" }
ocw-render = { path = "crates/ocw-render" }
ocw-assets = { path = "crates/ocw-assets" }
ocw-server = { path = "services/server" }

# Bevy is pinned to an exact version (spec §3.1). Only ocw-render and apps/desktop may use it.
bevy = "=0.20.1"
bevy_egui = "=0.43.1"
# Bevy's own math and glTF crates (both MIT OR Apache-2.0), for the
# Bevy-free asset crate ocw-assets (spec §8): no `import` feature (no image
# decoding, no file access).
glam = "0.33"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
raw-window-handle = "0.6"
# Same major version as Bevy's winit backend (window icon).
winit = "0.30"
btleplug = "0.13.5"
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
uuid = "1.29.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
serde_json = "1"
ureq = "3"
# Package signatures (spec §4.7). ed25519-dalek: BSD-3-Clause; sha2: MIT OR Apache-2.0.
# Pure Rust, no default features (no OS randomness), so ocw-world stays wasm-safe.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize", "fast"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
# OS randomness for key generation in the world builder only (MIT OR Apache-2.0).
getrandom = "0.3"

# QUIC game transport (spec §6.2), only in ocw-server: quinn (MIT OR
# Apache-2.0) on rustls (Apache-2.0 OR ISC OR MIT) with the *ring* crypto
# provider (Apache-2.0 AND ISC; already used by ureq's rustls), so no
# aws-lc-rs / CMake toolchain; rcgen (MIT OR Apache-2.0) for the dev
# certificate; bytes (MIT) for datagrams.
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
bytes = "1"

prost = "0.14"
prost-build = "0.14"
protox = "0.10"
clap = { version = "4.6", features = ["derive"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy recommendation: some optimisation for our code, full optimisation for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
