[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/web",
    "apps/bot",
    "apps/spike",
    "apps/world-builder",
    "services/server",
    "crates/ocw-core",
    "crates/ocw-sim",
    "crates/ocw-protocol",
    "crates/ocw-devices",
    "crates/ocw-world",
    "crates/ocw-render",
    "crates/ocw-worldgen",
    "crates/ocw-fit",
    "crates/ocw-worldstore",
    "crates/ocw-assets",
    "crates/ocw-voice",
    "crates/ocw-sky",
    "crates/ocw-weather",
    "crates/ocw-client",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ocw-core = { path = "crates/ocw-core" }
ocw-sim = { path = "crates/ocw-sim" }
ocw-protocol = { path = "crates/ocw-protocol" }
ocw-devices = { path = "crates/ocw-devices" }
ocw-world = { path = "crates/ocw-world" }
ocw-worldgen = { path = "crates/ocw-worldgen" }
ocw-fit = { path = "crates/ocw-fit" }
ocw-worldstore = { path = "crates/ocw-worldstore" }
ocw-render = { path = "crates/ocw-render" }
# ocw-assets without its command-line tools (`tools` feature) for the app.
ocw-assets = { path = "crates/ocw-assets", default-features = false }
ocw-server = { path = "services/server" }
ocw-voice = { path = "crates/ocw-voice" }
ocw-sky = { path = "crates/ocw-sky" }
ocw-weather = { path = "crates/ocw-weather" }
ocw-client = { path = "crates/ocw-client" }

# Bevy is pinned to an exact version (spec §3.1). Only ocw-render and apps/desktop may use it.
bevy = "=0.20.1"
bevy_egui = "=0.43.1"
# Ragdoll falls (spec §14 Phase 12C, Q5; chosen by the K2 spike): Avian, the
# ECS-native physics engine for this Bevy version (MIT OR Apache-2.0; its
# collision shapes come from parry3d, Apache-2.0). Only in ocw-render, for
# visuals on the client; builds for wasm32 too.
avian3d = { version = "=0.8.0", default-features = false, features = ["3d", "parry-f32", "xpbd_joints"] }
# Bevy's own math and glTF crates (both MIT OR Apache-2.0), for the
# Bevy-free asset crate ocw-assets (spec §8): no `import` feature (no image
# decoding, no file access).
glam = "0.33"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
# Material library (spec §4.6, Phase 8 T1): KTX2 reading – the version
# Bevy's own loader uses (Apache-2.0); for the converter in ocw-assets'
# `tools` (JPEG / PNG decoding: `image` below): pure-Rust BCn
# compression (texpresso, MIT), zip reading of pinned archives (MIT).
ktx2 = "0.5"
texpresso = { version = "2.0", features = ["rayon"] }
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
raw-window-handle = "0.6"
# Same major version as Bevy's winit backend (window icon).
winit = "0.30"
btleplug = "0.13.5"
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
uuid = "1.29.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
serde_json = "1"
ureq = "3"
# Package signatures (spec §4.7). ed25519-dalek: BSD-3-Clause; sha2: MIT OR Apache-2.0.
# Pure Rust, no default features (no OS randomness), so ocw-world stays wasm-safe.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize", "fast"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
# OS randomness for key generation in the world builder only (MIT OR Apache-2.0).
getrandom = "0.3"

# QUIC game transport (spec §6.2), only in ocw-server: quinn (MIT OR
# Apache-2.0) on rustls (Apache-2.0 OR ISC OR MIT) with the *ring* crypto
# provider (Apache-2.0 AND ISC; already used by ureq's rustls), so no
# aws-lc-rs / CMake toolchain; rcgen (MIT OR Apache-2.0) for the dev
# certificate; bytes (MIT) for datagrams.
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
bytes = "1"
# WebTransport endpoint for the browser app (spec §6.2, §14 Phase 10 B3):
# web-transport-quinn (MIT OR Apache-2.0) – HTTP/3's WebTransport handshake
# on our own quinn endpoint and rustls config (the *ring* provider, no
# aws-lc-rs); its streams are tokio AsyncRead / AsyncWrite, so the framing
# of the native transport is reused. url (MIT OR Apache-2.0; already in the
# tree) for its CONNECT requests, time (MIT OR Apache-2.0; rcgen's) for the
# 13-day validity of the certificate browsers take by hash.
web-transport-quinn = { version = "0.13.6", default-features = false, features = ["ring"] }
url = "2"
time = { version = "0.3", default-features = false }

# Audio output (spec §3.3), only in apps/desktop: cpal (Apache-2.0), the same
# version Bevy's own audio links, so no second copy (and one libasound).
cpal = "0.17"

# Time zones with the IANA tzdb compiled in (Unlicense OR MIT), only in
# ocw-sky: no system zoneinfo needed, the same on every OS and on wasm32.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
clap = { version = "4.6", features = ["derive"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# Screenshots (spec §11.4): JPEG/PNG encoding with metadata, the same image
# crate Bevy links (MIT OR Apache-2.0); chrono (MIT OR Apache-2.0, already in
# the tree) for the local UTC offset of the timestamp.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
thiserror = "2"
# std::time for wasm32-unknown-unknown (MIT OR Apache-2.0; already in the
# tree via bevy_platform): `Instant` / `SystemTime` from the browser.
web-time = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy recommendation: some optimisation for our code, full optimisation for dependencies.
# Debug info (spec §11.2, build profile of 2026-11-13): line tables only for
# our crates (backtraces keep file and line), none for the dependencies.
# Full debug info made each checkout's target/ 30–80 GB and the links slow.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The browser app (`make web`, spec §14 Phase 10): release, optimised for
# size (the download), thin LTO, no debug info.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
debug = false
strip = "debuginfo"
